<!doctype html>
<html lang="kk" translate="no">
<head>
<meta name="google" content="notranslate">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Білім аралы · 4-сынып</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#15324a;--sea:#1a6fb5;--sea2:#2bb0d6;--sand:#ffe7a8;--grn:#22b573;--red:#ff5a5f;--yel:#ffc233;--org:#ff8a3d;--pur:#7b5cff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#7fe3f0 0%,#2bb0d6 38%,#1a6fb5 100%) fixed;overflow-x:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;border:none;cursor:pointer;color:inherit;touch-action:manipulation}
.screen{display:none;min-height:100vh;flex-direction:column}.screen.on{display:flex}
.btn{background:#fff;color:var(--ink);font-weight:900;font-size:clamp(16px,1.8vw,22px);padding:12px 18px;border-radius:16px;box-shadow:0 5px 0 rgba(0,0,0,.22);white-space:nowrap}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.btn.g{background:var(--grn);color:#fff}.btn.y{background:var(--yel)}.btn.o{background:var(--org);color:#fff}
.btn:disabled{opacity:.45}
.shake{animation:shake .4s}@keyframes shake{0%,100%{translate:0}20%,60%{translate:-12px}40%,80%{translate:12px}}
.pop{animation:pop .35s}@keyframes pop{0%{scale:.4}70%{scale:1.12}100%{scale:1}}

/* gate */
#gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(180deg,#7fe3f0,#1a6fb5)}
#gate.off{display:none}
.gbox{background:#fff;border-radius:34px;padding:36px 40px;width:min(520px,100%);text-align:center;box-shadow:0 12px 0 rgba(0,0,0,.18)}
.gbox .lg{font-size:80px;line-height:1}
.gbox h1{font-size:clamp(34px,6vw,50px);font-weight:900;color:var(--sea)}
.gbox p{font-weight:800;opacity:.7;margin:4px 0 22px}
.gbox input{width:100%;font:900 28px Nunito,sans-serif;text-align:center;letter-spacing:3px;text-transform:uppercase;padding:14px;border:4px solid #bfe6f2;border-radius:20px;outline:none;color:var(--ink)}
.gbox input:focus{border-color:var(--sea2)}
.gbox .btn{width:100%;margin-top:14px;font-size:24px;padding:16px}
.gerr{color:var(--red);font-weight:900;min-height:24px;margin-top:10px}

/* home */
.hero{text-align:center;padding:26px 16px 6px;position:relative;color:#fff}
.hero h1{font-size:clamp(40px,6vw,82px);font-weight:900;text-shadow:0 5px 0 rgba(0,0,0,.18)}
.hero p{font-size:clamp(17px,2vw,25px);font-weight:800;opacity:.95}
.total{display:inline-block;margin-top:10px;background:rgba(255,255,255,.95);color:var(--ink);font-weight:900;font-size:clamp(18px,2vw,24px);padding:6px 18px;border-radius:999px}
.out{position:absolute;right:16px;top:16px}
.sec{max-width:1500px;margin:0 auto;width:100%;padding:6px clamp(14px,3vw,46px)}
.sec h2{color:#fff;font-size:clamp(22px,2.4vw,32px);font-weight:900;margin:16px 4px 10px;text-shadow:0 3px 0 rgba(0,0,0,.15)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.card{background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 8px 0 rgba(0,0,0,.18);display:flex;flex-direction:column}
.card .top{display:flex;gap:14px;align-items:center;padding:16px 16px 10px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff}
.card .ic{font-size:clamp(44px,4.6vw,58px)}
.card .t{font-size:clamp(20px,2vw,25px);font-weight:900;line-height:1.1}
.card .s{font-size:clamp(13px,1.3vw,16px);font-weight:800;opacity:.95;margin-top:3px}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px}
.lv{border-radius:16px;padding:8px 4px;background:#f0f8fc;font-weight:900;font-size:clamp(14px,1.4vw,17px);display:flex;flex-direction:column;align-items:center;gap:2px;border:3px solid #d8eef6}
.lv .st{font-size:clamp(14px,1.4vw,18px);letter-spacing:1px}
.lv.lock{opacity:.5}
.lv:not(.lock):active{transform:translateY(3px)}
.foot{text-align:center;color:#fff;opacity:.8;font-weight:800;padding:22px}

/* game */
.top2{display:flex;align-items:center;gap:10px;padding:12px 16px 4px}
.gt{flex:1;text-align:center;font-size:clamp(18px,2.6vw,34px);font-weight:900;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.18)}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:8px 16px 22px;width:100%}
.dots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.dots i{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.4)}.dots i.d{background:var(--yel)}.dots i.c{background:#fff;transform:scale(1.25)}
.tbox{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:1300px}
.panel{background:#fff;border-radius:28px;padding:18px 26px;box-shadow:0 8px 0 rgba(0,0,0,.15);text-align:center}
.title{font-size:clamp(22px,2.8vw,40px);font-weight:900;text-align:center;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.18);line-height:1.2}
.q{font-size:clamp(40px,6vw,96px);font-weight:900;line-height:1.1}
.txt{font-size:clamp(22px,2.6vw,38px);font-weight:900;line-height:1.35;max-width:1100px}
.opts{display:flex;gap:clamp(10px,1.4vw,20px);flex-wrap:wrap;justify-content:center}
.opt{min-width:clamp(90px,10vw,160px);min-height:clamp(70px,8vw,112px);padding:8px 22px;background:#fff;color:var(--ink);border-radius:22px;font-size:clamp(28px,3.8vw,56px);font-weight:900;box-shadow:0 7px 0 #8fc6dc}
.opt.sm{font-size:clamp(20px,2.4vw,34px)}
.opt:active{transform:translateY(5px);box-shadow:0 2px 0 #8fc6dc}
.opt.ok{background:var(--grn);color:#fff;box-shadow:0 7px 0 #158a55}.opt.no{background:var(--red);color:#fff;box-shadow:0 7px 0 #c63e43}
.opt:disabled{opacity:.55}
#flash{position:fixed;left:50%;top:14%;translate:-50% 0;font-size:clamp(34px,5vw,68px);font-weight:900;color:#fff;text-shadow:0 5px 0 rgba(0,0,0,.3);pointer-events:none;opacity:0;transition:opacity .2s;z-index:15;white-space:nowrap}
#flash.on{opacity:1}

/* keypad + chest */
.locks{display:flex;gap:8px;font-size:clamp(30px,3.6vw,48px)}
.chest{font-size:clamp(70px,9vw,120px);line-height:1}
.disp{min-width:240px;height:clamp(62px,7vw,92px);border-radius:18px;background:#fff;font-size:clamp(38px,4.6vw,64px);font-weight:900;display:grid;place-items:center;padding:0 22px;box-shadow:0 6px 0 #8fc6dc;border:4px solid var(--yel)}
.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.key{width:clamp(56px,6vw,84px);height:clamp(52px,5.4vw,74px);border-radius:16px;background:#fff;font-size:clamp(26px,3vw,40px);font-weight:900;box-shadow:0 5px 0 #8fc6dc}
.key:active{transform:translateY(4px);box-shadow:0 1px 0 #8fc6dc}
.key.ok{background:var(--grn);color:#fff;box-shadow:0 5px 0 #158a55}.key.del{background:var(--org);color:#fff;box-shadow:0 5px 0 #c96a25}

/* road */
.road{position:relative;width:min(1100px,94vw);height:clamp(90px,11vw,130px);border-radius:22px;background:#4a5565;overflow:hidden;box-shadow:0 7px 0 rgba(0,0,0,.2)}
.road::before{content:'';position:absolute;left:0;right:0;top:50%;border-top:6px dashed #ffd84d;translate:0 -50%}
.car{position:absolute;top:50%;translate:0 -50%;font-size:clamp(46px,5.5vw,70px);transition:left 1s ease-in-out;line-height:1}
.car.l{left:2%;scale:-1 1}.car.r{left:88%}
.flag{position:absolute;right:1%;top:50%;translate:0 -50%;font-size:clamp(34px,4vw,50px)}

/* brackets */
.expr{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;font-size:clamp(40px,5.6vw,86px);font-weight:900}
.tok{background:#fff;border-radius:16px;padding:2px 18px;box-shadow:0 6px 0 #8fc6dc;font-size:inherit;font-weight:900}
.tok.sel{background:var(--yel)}
.opr{color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.2);padding:0 4px}
.br{color:var(--red);text-shadow:0 3px 0 #fff}

/* number line */
.nline{position:relative;width:min(1000px,92vw);height:120px}
.nline .bar{position:absolute;left:4%;right:4%;top:60px;height:8px;background:#fff;border-radius:4px}
.nline .tk{position:absolute;top:50px;width:4px;height:28px;background:#fff;translate:-50% 0;border-radius:2px}
.nline .tk.big{height:40px;top:44px;width:6px}
.nline .lb{position:absolute;top:92px;translate:-50% 0;color:#fff;font-weight:900;font-size:clamp(18px,2.2vw,28px)}
.nline .arr{position:absolute;top:0;translate:-50% 0;display:flex;flex-direction:column;align-items:center;font-weight:900;color:var(--ink)}
.nline .arr b{background:var(--yel);border-radius:12px;padding:2px 12px;font-size:clamp(20px,2.4vw,30px)}
.nline .arr i{font-style:normal;font-size:24px;line-height:1}

/* sort / baskets */
.word{font-size:clamp(46px,6vw,92px);font-weight:900;background:#fff;border-radius:26px;padding:10px 40px;box-shadow:0 8px 0 #8fc6dc}
.bins{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;width:100%}
.bin{flex:1 1 200px;max-width:320px;min-height:clamp(100px,12vw,150px);border-radius:24px;color:#fff;font-size:clamp(22px,2.6vw,36px);font-weight:900;border:5px solid #fff;box-shadow:0 8px 0 rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.bin small{font-size:.5em;opacity:.9}
.bin:active{transform:translateY(5px)}
.timer{width:min(700px,90vw);height:22px;border-radius:12px;background:rgba(255,255,255,.35);overflow:hidden}.timer i{display:block;height:100%;background:var(--yel);transition:width .25s linear}

/* word parts */
.wparts{display:flex;align-items:stretch;justify-content:center;flex-wrap:wrap;background:#fff;border-radius:26px;padding:14px 18px;box-shadow:0 8px 0 #8fc6dc}
.wl{font-size:clamp(46px,6.4vw,96px);font-weight:900;padding:0 2px;line-height:1.2}
.wl.root{color:var(--grn)}.wl.aff{color:var(--org)}
.gap{width:clamp(22px,2.6vw,34px);border-radius:10px;position:relative;background:transparent}
.gap::after{content:'';position:absolute;left:50%;top:12%;bottom:12%;border-left:4px dashed #c9e3ee;translate:-50% 0}
.gap.cut::after{border-left:7px solid var(--red)}
.gap:active{background:#eef8fc}

/* proverb build */
.pv{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:1100px}
.pw{background:#fff;border-radius:16px;padding:8px 18px;font-size:clamp(22px,2.6vw,36px);font-weight:900;box-shadow:0 5px 0 #8fc6dc}
.pw.used{visibility:hidden}
.built{min-height:80px;background:rgba(255,255,255,.25);border:4px dashed #fff;border-radius:22px;padding:12px 18px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;width:min(1100px,94vw)}
.built span{background:var(--yel);border-radius:14px;padding:6px 14px;font-size:clamp(22px,2.6vw,36px);font-weight:900}

/* falling pairs */
.fallz{position:relative;width:min(900px,94vw);height:min(52vh,460px);border-radius:26px;background:rgba(255,255,255,.18);border:4px solid rgba(255,255,255,.5);overflow:hidden}
.pair{position:absolute;left:50%;translate:-50% 0;top:0;background:#fff;border-radius:22px;padding:10px 24px;font-size:clamp(28px,3.6vw,50px);font-weight:900;white-space:nowrap;box-shadow:0 6px 0 #8fc6dc}
.pair.ok{background:var(--grn);color:#fff}.pair.no{background:var(--red);color:#fff}
.sabtns{display:flex;gap:16px}
.sabtns .bin{max-width:none;min-width:clamp(150px,22vw,300px)}

.venn{position:relative;width:min(900px,94vw);aspect-ratio:2.2;border:5px dashed #b9c8d4;background:#fff;border-radius:26px;box-shadow:0 8px 0 #8fc6dc;cursor:pointer;overflow:hidden}
.venn .vc{position:absolute;width:41%;aspect-ratio:1;top:50%;translate:0 -50%;border-radius:50%;border:5px solid;pointer-events:none}
.venn .va{left:17.5%;background:rgba(43,176,214,.18);border-color:#2bb0d6}.venn .vb{left:41.5%;background:rgba(255,138,61,.18);border-color:#ff8a3d}
.venn .vl{position:absolute;top:2%;font-weight:900;font-size:clamp(16px,2vw,26px);padding:2px 12px;border-radius:12px;color:#fff;pointer-events:none}
.venn .la{left:22%;background:#2bb0d6}.venn .lb{right:22%;background:#ff8a3d}
.venn .vo{position:absolute;top:4%;width:15%;text-align:center;font-weight:900;font-size:clamp(11px,1.4vw,17px);color:#8a9aa8;line-height:1.1;pointer-events:none}.venn .vol{left:1%}.venn .vor{right:1%}
.vbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(900px,94vw)}
.vbt{border-radius:16px;padding:12px 6px;font-weight:900;font-size:clamp(14px,1.7vw,22px);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.2);line-height:1.15}
.vbt:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.vbt.zA{background:#2bb0d6}.vbt.zAB{background:#8e7cc3}.vbt.zB{background:#ff8a3d}.vbt.zO{background:#7d8b97}
.howto2{color:#fff;font-weight:800;font-size:clamp(14px,1.5vw,18px);opacity:.9}
@media(max-width:760px){.vbtns{grid-template-columns:1fr 1fr}}
.venn .vz{display:none}
.venn .vi{position:absolute;translate:-50% -50%;font-size:clamp(22px,3vw,42px);font-weight:900;pointer-events:none;color:var(--ink)}
.venn .vn{position:absolute;translate:-50% -50%;font-size:clamp(34px,4.6vw,64px);font-weight:900;background:var(--yel);border-radius:16px;padding:0 14px;pointer-events:none}
.vcur{min-width:120px;text-align:center}
#flash.long{white-space:normal}
.sol{display:flex;flex-direction:column;align-items:center;gap:6px}
.sl{background:rgba(255,255,255,.92);border-radius:14px;padding:4px 18px;font-size:clamp(22px,2.8vw,40px);font-weight:900}
.sl.fin{background:var(--yel)}.sl.ck{background:var(--grn);color:#fff;font-size:clamp(16px,2vw,28px)}
.ceo{flex-direction:column;align-items:center}
.pad2{display:flex;flex-direction:column;align-items:center;gap:10px}
.rtop{display:flex;align-items:center;gap:14px;width:min(1100px,94vw)}.rtop .timer{flex:1}
.rclk{font-size:clamp(28px,3vw,40px);font-weight:900;color:#fff;background:rgba(0,0,0,.2);border-radius:14px;padding:2px 16px;min-width:80px;text-align:center}.rclk.warn{background:var(--red)}
.rbox{background:#fff;border-radius:28px;padding:20px clamp(18px,3vw,44px);width:min(1250px,96vw);box-shadow:0 8px 0 #8fc6dc}
.rbox h3{text-align:center;color:var(--org);font-size:clamp(24px,2.6vw,38px);margin-bottom:4px}
.rtext{font-size:clamp(18px,1.85vw,30px);font-weight:800;line-height:1.45;text-align:left}
.rw{border-radius:6px;transition:background .2s}.rw.rd{background:#c9f2dc}
.rtext.pick .rw{cursor:pointer}.rtext.pick .rw:hover{background:#ffe7a8}
.lvpick{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}.lvpick .btn{font-size:clamp(22px,2.6vw,34px);padding:18px 30px}
.dcard{text-align:left;padding:0;border:none}.dcard .top{border-radius:26px}
.duel{display:flex;gap:14px;width:100%;flex:1;align-items:stretch}
.dside{flex:1;min-width:0;border-radius:26px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px;border:6px solid}
.dside.s0{background:rgba(255,90,95,.2);border-color:#ff5a5f}.dside.s1{background:rgba(26,111,181,.25);border-color:#1a6fb5}
.dh{display:flex;justify-content:space-between;align-items:center;width:100%;color:#fff;font-weight:900;font-size:clamp(18px,2vw,28px)}
.dclk{background:rgba(0,0,0,.25);border-radius:12px;padding:0 12px;font-variant-numeric:tabular-nums}
.dside .tbox{gap:14px;max-width:none;flex:1;justify-content:center}
.dside .q{font-size:clamp(26px,3.2vw,62px)}.dside .txt{font-size:clamp(15px,1.7vw,28px)}.dside .title{font-size:clamp(15px,1.7vw,28px)}
.dside .panel{padding:8px 12px;border-radius:20px}.dside .opts{gap:8px}
.dside .opt{min-width:70px;min-height:clamp(54px,5vw,84px);font-size:clamp(20px,2.5vw,44px);padding:6px 14px;border-radius:18px}.dside .opt.sm{font-size:clamp(14px,1.7vw,28px)}
.dside .key{width:clamp(40px,4.2vw,80px);height:clamp(40px,3.8vw,70px);font-size:clamp(20px,2.4vw,36px);border-radius:14px}.dside .keys{gap:6px}
.dside .disp{min-width:160px;height:clamp(48px,4.6vw,78px);font-size:clamp(28px,3vw,50px)}
.dside .road,.dside .nline,.dside .venn,.dside .vbtns{width:100%}.dside .road{height:clamp(60px,6vw,90px)}.dside .car{font-size:clamp(30px,3vw,46px)}
.dside .chest{font-size:clamp(40px,4vw,60px)}.dside .locks{font-size:clamp(18px,1.8vw,26px)}
.dside .expr{font-size:clamp(26px,3.2vw,58px)}.dside .tok{padding:2px 10px}.dside .sl{font-size:clamp(15px,1.9vw,32px)}
.dside .vcur{font-size:clamp(34px,3.4vw,56px);padding:4px 18px}.dside .vbt{font-size:clamp(11px,1.15vw,19px);padding:10px 4px}.dside .venn .vn{font-size:clamp(20px,2vw,34px)}.dside .venn .vi{font-size:clamp(18px,2vw,30px)}
.dside .nline .lb{font-size:clamp(14px,1.3vw,20px)}.dside .howto2{font-size:13px}
.ddone{font-size:clamp(30px,3vw,52px);font-weight:900;color:#fff;text-align:center;margin-top:30px;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.ddone small{font-size:.55em}
@media(max-width:760px){.duel{flex-direction:column}}
/* final */
#final{position:fixed;inset:0;background:rgba(8,40,70,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#final.on{display:flex}
.fb{background:#fff;border-radius:36px;padding:30px 44px;text-align:center;animation:pop .45s;max-width:96vw}
.fb .st{font-size:clamp(56px,7vw,92px);letter-spacing:6px}
.fb h2{font-size:clamp(46px,6.4vw,96px);font-weight:900;color:var(--grn);line-height:1.05}
.fb p{font-size:clamp(19px,2.4vw,30px);font-weight:900;margin:8px 0 20px;line-height:1.3}
.fb .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
#cf{position:fixed;inset:0;pointer-events:none;z-index:30}

@media (max-width:760px){
 .hero{padding-top:62px}.out{right:10px;top:10px}
 .cards{grid-template-columns:1fr;gap:12px}
 .top2{padding:10px 10px 4px}.btn{padding:9px 12px}
 .keys{gap:6px}.key{width:48px;height:48px}
 .disp{min-width:180px}
 .fb{padding:22px 16px}
 .wparts{padding:10px 8px}.gap{width:20px}
 .bin{flex-basis:44%}
}
</style>
</head>
<body>

<div id="gate" class="off"><form class="gbox" id="gf"><div class="lg">🏝️</div><h1>Білім аралы</h1><p>4-сынып · кіру коды</p>
  <input id="gc" autocomplete="off" spellcheck="false" placeholder="КОД"><button class="btn g">Кіру ➜</button><div class="gerr" id="ge"></div></form></div>

<section id="home" class="screen on">
  <div class="hero"><a class="btn out" href="../" style="text-decoration:none;left:16px;right:auto">⬅ neuroUstaz</a>
    <h1>🏝️ Білім аралы</h1><p>4-сынып · математика мен қазақ тілі</p><div class="total" id="total"></div></div>
  <div id="groups"></div>
  <div class="foot">Әр ойында 3 деңгей · жұлдыз жина ⭐</div>
</section>

<section id="game" class="screen">

const st_=(l,v,w)=>({l,v,w:[...new Set(w.filter(x=>Number.isInteger(x)&&x>0&&x!==v))].slice(0,2)});
const CEQ=[
 [()=>{const p=rnd(12,40),q=rnd(4,25),R=p*q;if(R<120)return;const a=rnd(30,R-20),x=R-a;return{eq:`x + ${a} = ${p} · ${q}`,x,steps:[st_(`x + ${a}`,R,[R+p,p*q+q,R-10])]}},
  ()=>{const p=rnd(12,40),q=rnd(4,25),R=p*q,x=rnd(50,600),B=R+x;return{eq:`${B} − x = ${p} · ${q}`,x,steps:[st_(`${B} − x`,R,[R+q,R-p,R+10])]}},
  ()=>{const a=rnd(3,9),x=rnd(12,99),Rv=a*x,C=rnd(100,600),B=Rv+C;return{eq:`x · ${a} = ${B} − ${C}`,x,steps:[st_(`x · ${a}`,Rv,[B+C,Rv+10,Rv-10])]}},
  ()=>{const a=rnd(4,15),k=rnd(12,50),x=a*k,c=rnd(6,30),B=k*c;return{eq:`x : ${a} = ${B} : ${c}`,x,steps:[st_(`x : ${a}`,k,[k+c,k*2,k-2])]}}],
 [()=>{const x=rnd(10,40),a=rnd(3,9),b=rnd(10,90),R=a*x+b;const ds=[];for(let d=3;d<=50;d++)if(R%d===0&&R/d>=3&&R/d<=50)ds.push(d);if(!ds.length)return;const p=one(ds),q=R/p;
   return{eq:`${a} · x + ${b} = ${p} · ${q}`,x,steps:[st_(`${a} · x + ${b}`,R,[p+q,R+p,R-q]),st_(`${a} · x`,R-b,[R+b,R-b+a,R-b-10])]}},
  ()=>{const x=rnd(30,100),a=rnd(5,25),b=rnd(3,9),Rv=(x-a)*b,d=rnd(2,5),C=Rv*d;return{eq:`(x − ${a}) · ${b} = ${C} : ${d}`,x,steps:[st_(`(x − ${a}) · ${b}`,Rv,[C*d,Rv+d,Rv-b]),st_(`x − ${a}`,Rv/b,[Rv-b,Rv/b+a,Rv/b+b])]}},
  ()=>{const x=rnd(4,15),k=rnd(8,40),B=k*x,c=rnd(10,60),D=k+c,d1=rnd(5,D-5),d2=D-d1;return{eq:`${B} : x + ${c} = ${d1} + ${d2}`,x,steps:[st_(`${B} : x + ${c}`,D,[D+c,d1*d2,D-1]),st_(`${B} : x`,k,[D+c,k+c,k+1])]}},
  ()=>{const m=rnd(12,40),b=rnd(3,9),a=rnd(10,40),x=m*b-a;if(x<5)return;const p=rnd(3,m-3),q=m-p;return{eq:`(x + ${a}) : ${b} = ${p} + ${q}`,x,steps:[st_(`(x + ${a}) : ${b}`,m,[p*q,m+b,m-1]),st_(`x + ${a}`,m*b,[m+b,m*b+a,m*b-b])]}}],
 [()=>{const x=rnd(12,60),a=rnd(3,9),c=rnd(2,9),b=(a*x)%c+c*rnd(1,8);if(a*x-b<=0)return;const D=(a*x-b)/c;
   return{eq:`(x · ${a} − ${b}) : ${c} = ${D}`,x,steps:[st_(`x · ${a} − ${b}`,D*c,[D+c,D*c+b,D*c-c]),st_(`x · ${a}`,D*c+b,[D*c-b,D*c+b+a,D*c+b-10])]}},
  ()=>{const x=rnd(10,80),a=rnd(20,150),b=rnd(2,6),P=(x+a)*b,C=rnd(50,400),B=P+C;return{eq:`${B} − (x + ${a}) · ${b} = ${C}`,x,steps:[st_(`(x + ${a}) · ${b}`,P,[B+C,P+b,P-10]),st_(`x + ${a}`,P/b,[P-b,P/b+a,P/b+b])]}},

{t:'Көктем',b:'Көктем келді. Күн жылынып, қар еріді. Таудан аққан бұлақтар сылдырлап, өзенге құйылды. Ағаштар бүршік жарып, жасыл жапырақ шығарды. Далада алғашқы гүлдер көрінді. Қызғалдақтар қызыл кілемдей жайқалды. Жылы жақтан құстар ұшып келді. Қарлығаштар ұя салуға кірісті. Шымшықтар таңертеңнен кешке дейін шырылдайды. Ауылдағы адамдар да тыным таппайды. Біреулер бақшасына көшет отырғызып жатыр. Енді біреулер егін алқабына тұқым себуде. Балалар сабақтан кейін далаға шығып ойнайды. Олар доп қуып, секіртпе секіреді. Кешке қарай аула күлкіге толады. Әжем терезенің алдында отырып, бізге қарап күледі. Ол көктемді жыл басы деп атайды. Расында да, көктемде табиғат жаңадан оянады. Барлық тіршілік иесі жылы күнге қуанады. Мен көктемді өте жақсы көремін, себебі бұл кезде бәрі жаңарып, құлпырып тұрады.'},
{t:'Менің досым',b:'Менің ең жақын досым — Ерлан. Біз бір сыныпта оқимыз. Ерлан өте мейірімді әрі көпшіл бала. Ол сабақты жақсы оқиды, әсіресе математиканы ұнатады. Қиын есептер шыққанда, ол маған түсіндіріп береді. Мен оған ағылшын тілінен көмектесемін. Сөйтіп, біз бір-бірімізге қолдау көрсетеміз. Демалыс күндері біз бірге велосипед тебеміз. Кейде саябаққа барып, футбол ойнаймыз. Ерланның кішкентай інісі бар. Ол да біздің соңымыздан қалмайды. Біз оны ренжітпей, ойынға қосамыз. Бірде мен ауырып, мектепке бара алмадым. Сонда Ерлан күнде келіп, үй тапсырмасын айтып тұрды. Ол маған кітаптарын да әкеліп берді. Мен оның осы қамқорлығын ешқашан ұмытпаймын. Нағыз дос қиын сәтте қасыңнан табылады. Жақсы досы бар адам ешқашан жалғыз қалмайды. Мен осындай досым бар екеніне қатты қуанамын. Біз үлкейгенде де дос болып қаламыз деп сенемін.'}],[
{t:'Қазақстан',b:'Қазақстан — біздің Отанымыз. Ол — жері кең, табиғаты сұлу ел. Қазақстанның аумағы өте үлкен, ол жер көлемі бойынша әлемде тоғызыншы орын алады. Еліміздің солтүстігінде жасыл орманды өлкелер, оңтүстігінде биік таулар бар. Батысында Каспий теңізі толқып жатыр. Шығысында Алтай тауларының ақ шыңдары көкке тірелген. Ел ортасында ұшы-қиыры жоқ кең дала жатыр. Қазақстанда жүзден астам ұлттың өкілдері тату-тәтті өмір сүреді. Еліміздің астанасы — Астана қаласы. Ол Есіл өзенінің жағасында орналасқан. Қалада әдемі ғимараттар көп. Солардың бірі — «Бәйтерек» монументі. Ол еліміздің символына айналған. Қазақстанның мемлекеттік рәміздері — Ту, Елтаңба және Әнұран. Көк туымыз ашық аспанды бейнелейді. Тудағы алтын күн мен қалықтаған қыран бейбітшілік пен еркіндікті білдіреді. Біз Отанымызды сүйеміз және оны қорғауға әрдайым дайынбыз. Жақсы оқып, білім алу — Отанға қызмет етудің алғашқы қадамы.'},
{t:'Кітап — білім бұлағы',b:'Кітап — адамның ең жақсы досы. Ол бізге жаңа әлемнің есігін ашады. Кітап оқыған бала көп нәрсені біледі, ойы ұшқыр, сөздік қоры бай болады. Менің әкем кітапты өте жақсы көреді. Үйімізде үлкен кітап сөресі бар. Онда ертегілер, энциклопедиялар, тарихи әңгімелер тұр. Кешкі ас ішкен соң, біз бүкіл отбасымызбен кітап оқимыз. Әкем бізге батырлар туралы оқып береді. Анам ертегілерді мәнерлеп оқиды. Мен жақында Ыбырай Алтынсариннің әңгімелерін оқып шықтым. Олар еңбекқор әрі адал болуға үйретеді. Апта сайын мен мектеп кітапханасына барамын. Кітапханашы апай бізге жаңа кітаптар ұсынады. Кітапты күтіп ұстау керек. Оның беттерін бүктеуге, үстіне жазуға болмайды. Оқып болған кітапты орнына қою керек. Кітап оқыған сайын, мен жаңа сөздер үйренемін. Кітап оқыған сайын, мен өзімді ақылды әрі бақытты сезінемін. Сондықтан кітап менің ең жақын серігім болып қала береді.'}],[
{t:'Құстардың қамқоршылары',b:'Қыс қатты болды. Бірнеше күн бойы боран соғып, айнала аппақ қарға оранды. Құстарға жем табу қиындады. Сол кезде сынып жетекшісі Сәуле апай бізге қызықты ұсыныс жасады. Ол құстарға жемсауыт жасап, мектеп ауласына іліп қоюды тапсырды. Біз бұл істі қуана қолға алдық. Әрқайсымыз үйден бос қораптар мен ағаш тақтайшалар әкелдік. Әкелеріміз бізге балға мен шеге ұстауды үйретті. Бір апта бойы біз шеберханада жұмыс істедік. Нәтижесінде он екі әдемі жемсауыт дайын болды. Біз оларды ағаштардың бұтақтарына мықтап байладық. Ішіне тары, күнбағыстың дәні мен нан үгінділерін салдық. Келесі күні таңертең аулаға шыққанда, жемсауыттардың басында шымшықтар мен көкшымшықтардың жүргенін көрдік. Олар бір-бірімен таласып, дән шоқып жатты. Біз қатты қуандық. Содан бері күнде кезекшілер жемсауыттарға жем салып тұрады. Сәуле апай: «Табиғатқа қамқорлық жасау — әрбір адамның парызы», — деді. Біз бұл сөзді жадымызға мықтап сақтадық.'},
{t:'Ғарышқа саяхат',b:'Қазақстанда әлемге әйгілі Байқоңыр ғарыш айлағы орналасқан. Дәл осы жерден 1961 жылы адамзат тарихындағы алғашқы ғарышкер Юрий Гагарин ғарышқа ұшқан. Бүгінде Байқоңырдан ғарыш кемелері мен жасанды серіктер үнемі ұшырылады. Қазақ халқының да өз ғарышкерлері бар. Тоқтар Әубәкіров — тұңғыш қазақ ғарышкері. Ол 1991 жылы ғарышқа ұшып, сегіз күн бойы ғылыми тәжірибелер жүргізді. Одан кейін Талғат Мұсабаев үш рет ғарышқа сапар шекті. Ал 2015 жылы Айдын Айымбетов ғарыштан туған жерімізді суретке түсірді. Ғарышкер болу оңай емес. Ол үшін денсаулығың мықты, білімің терең, мінезің шыдамды болуы керек. Ғарышкерлер көп жыл бойы дайындықтан өтеді. Олар физика, математика, астрономия ғылымдарын жетік меңгереді. Мен де болашақта ғарышкер болуды армандаймын. Сол үшін қазірден бастап жақсы оқып, спортпен айналысамын. Кім біледі, бәлкім, бір күні мен де жұлдыздарға саяхат жасаймын.'}]];

function venn(box,A,B){const wrap=el('div','venn'),api={wrap};
  wrap.innerHTML=`<div class="vc va"></div><div class="vc vb"></div><div class="vl la">${A}</div><div class="vl lb">${B}</div><div class="vo vol">ешқай&shy;сысы</div><div class="vo vor">ешқай&shy;сысы</div>`;box.append(wrap);
  api.buttons=()=>{const r=el('div','vbtns');[['A',`Тек «${A}»`],['AB','Екеуіне де'],['B',`Тек «${B}»`],['O','🚫 Ешқайсысына']].forEach(([z,t])=>{const b=el('button','vbt z'+z,t);b.onclick=()=>api.onPick&&api.onPick(z);r.append(b)});box.append(r)};
  const P={A:[.27,.5],AB:[.5,.5],B:[.73,.5],O:[.085,.5]},cnt={A:0,AB:0,B:0,O:0};
  const zone=(x,y)=>{const r=wrap.getBoundingClientRect(),w=r.width,h=r.height,px=x-r.left,py=y-r.top,R=.205*w;
    const ia=Math.hypot(px-.38*w,py-h/2)<=R,ib=Math.hypot(px-.62*w,py-h/2)<=R;return ia&&ib?'AB':ia?'A':ib?'B':'O'};
  wrap.addEventListener('click',e=>{if(api.onPick)api.onPick(zone(e.clientX,e.clientY),e.clientX,e.clientY)});
  const SL={A:[[.26,.33],[.26,.67],[.21,.5],[.32,.5],[.29,.2],[.29,.8]],AB:[[.5,.33],[.5,.67],[.5,.5],[.5,.18],[.5,.82]],
    B:[[.74,.33],[.74,.67],[.79,.5],[.68,.5],[.71,.2],[.71,.8]],O:[[.085,.3],[.915,.3],[.085,.7],[.915,.7],[.085,.5],[.915,.5]]};
  api.put=(z,txt)=>{const sl=SL[z][cnt[z]%SL[z].length];cnt[z]++;const s=el('span','vi pop',txt);s.style.left=sl[0]*100+'%';s.style.top=sl[1]*100+'%';wrap.append(s)};
  api.num=(z,v)=>{const s=el('span','vn pop',v);s.style.left=P[z][0]*100+'%';s.style.top=P[z][1]*100+'%';wrap.append(s)};
  api.hl=z=>{wrap.querySelectorAll('.vz').forEach(e=>e.classList.toggle('on',e.dataset.z===z))};return api}

{id:'sa',sec:1,icon:'↔️',title:'Синоним – антоним',sub:'Құлап жатқан сөздерді сұрыпта',c1:'#2bb0d6',c2:'#7b5cff',
 run(st,id,l,done){const N=[10,12,15][l],DUR=[9,6.5,4.5][l]*1000;const items=shuffle([...pick(SYN,Math.ceil(N/2)).map(p=>({p,s:true})),...pick(ANT,Math.ceil(N/2)).map(p=>({p,s:false}))]).slice(0,N);
   let i=0,err=0,cur=null,anim=null;const dots=el('div','dots'),z=el('div','fallz'),bt=el('div','sabtns');st.append(dots,el('div','title','Сөз жұбы — синоним бе, антоним бе?'),z,bt);
   const next=()=>{if(!alive(id))return;dots.innerHTML='';items.forEach((_,j)=>dots.append(el('i',j<i?'d':j===i?'c':'')));if(i>=N)return done(err,'Барлық жұп сұрыпталды! ↔️');
     const it=items[i];cur=el('div','pair',`${it.p[0]} — ${it.p[1]}`);z.append(cur);const H=z.clientHeight-cur.offsetHeight-6;
     anim=cur.animate([{top:'0px'},{top:H+'px'}],{duration:DUR,easing:'linear',fill:'forwards'});anim.onfinish=()=>{if(!alive(id))return;err++;beep('bad');cur.classList.add('no');flash(it.s?'Бұл — синоним':'Бұл — антоним');const c=cur;cur=null;setTimeout(()=>{c.remove();i++;next()},800)}};
   [[true,'🟰 Синоним','мағынасы жақын','#22b573'],[false,'↔️ Антоним','мағынасы қарама-қарсы','#ff5a5f']].forEach(([v,a,b,c])=>{const x=el('button','bin',`${a}<small>${b}</small>`);x.style.background=c;
     x.onclick=()=>{if(!cur||!alive(id))return;const it=items[i];anim.pause();const c2=cur;cur=null;if(it.s===v){beep('ok');c2.classList.add('ok')}else{beep('bad');err++;c2.classList.add('no');reanim(x,'shake');flash(it.s?'Бұл — синоним':'Бұл — антоним')}
       setTimeout(()=>{c2.remove();i++;next()},it.s===v?450:900)};bt.append(x)});
   next()}},
];

/* ===== home ===== */
function drawHome(){const gr=$('#groups');gr.innerHTML='';let tot=0;
  ['🧮 Математика','📖 Қазақ тілі'].forEach((name,si)=>{const s=el('div','sec',`<h2>${name}</h2>`),cs=el('div','cards');s.append(cs);gr.append(s);
    GAMES.filter(g=>g.sec===si).forEach(g=>{const sv=starsOf(g.id);tot+=sv.reduce((a,b)=>a+b,0);
      const c=el('div','card',`<div class="top"><div class="ic">${g.icon}</div><div><div class="t">${g.title}</div><div class="s">${g.sub}</div></div></div>`);c.querySelector('.top').style.cssText=`--c1:${g.c1};--c2:${g.c2}`;
      const lv=el('div','lvls');[0,1,2].forEach(l=>{const lock=false;const b=el('button','lv'+(lock?' lock':''),`${LV[l]}<span class="st">${lock?'🔒':'⭐'.repeat(sv[l])+'☆'.repeat(3-sv[l])}</span>`);
        b.onclick=()=>{if(lock){flash('Алдымен алдыңғы деңгейді өт 🙂');return}beep('tap');play(g,l)};lv.append(b)});c.append(lv);cs.append(c)})});
  const ds=el('div','sec',`<h2>⚔️ Екі оқушы жарысы <small style="font-size:.6em;opacity:.9">· математика</small></h2>`),dc=el('div','cards');ds.append(dc);gr.prepend(ds);
  GAMES.filter(g=>g.sec===0).forEach(g=>{const c=el('button','card dcard',`<div class="top"><div class="ic">${g.icon}</div><div><div class="t">${g.title}</div><div class="s">⚔️ 2 оқушы</div></div></div>`);
    c.querySelector('.top').style.cssText=`--c1:${g.c1};--c2:${g.c2}`;c.onclick=()=>{beep('tap');duelMenu(g)};dc.append(c)});
  $('#total').textContent=`⭐ ${tot} / ${GAMES.length*9}`}

/* ===== 2 оқушы жарысы ===== */
const DUEL_N={tr:5,sp:5,br:5,rd:6,un:6,ce:3,vn:2};
function duelMenu(g){RID++;stopCF();$('#final').classList.remove('on');window.DUEL=false;$('#gt').textContent=`⚔️ ${g.icon} ${g.title}`;show('game');const st=$('#stage');st.innerHTML='';
  st.append(el('div','title',`⚔️ Екі оқушы жарысы<br><small style="font-size:.6em">Әрқайсыңа ${DUEL_N[g.id]||5} тапсырма. Кім тез әрі қатесіз шешеді?<br>Әр қате үшін +5 секунд</small>`),el('div','title','Деңгейді таңдаңдар:'));
  const r=el('div','lvpick');[0,1,2].forEach(l=>{const b=el('button','btn',LV[l]);b.onclick=()=>duel(g,l);r.append(b)});st.append(r)}
function duel(g,l){RID++;const id=RID;stopCF();$('#final').classList.remove('on');CUR=g;CL=l;window.DUEL=true;$('#gt').textContent=`⚔️ ${g.icon} ${g.title} · ${LV[l]}`;show('game');
  const st=$('#stage');st.innerHTML='';const wrap=el('div','duel');st.append(wrap);const N=DUEL_N[g.id]||5,t0=performance.now(),res=[null,null];let iv;
  const fmtT=t=>t.toFixed(1);
  const check=()=>{if(!res[0]||!res[1])return;clearInterval(iv);setTimeout(()=>{if(!alive(id))return;RID++;window.DUEL=false;
    const w=res[0].score<res[1].score?0:res[1].score<res[0].score?1:-1,name=i=>i?'🔵 2-оқушы':'🔴 1-оқушы';
    $('#fst').textContent=w<0?'🤝':'🏆';$('#fh').textContent=w<0?'Тең түсті!':name(w)+' жеңді!';
    $('#fp').innerHTML=[0,1].map(i=>`${name(i)}: ${fmtT(res[i].tm)} сек, қате ${res[i].err} → <b>${fmtT(res[i].score)}</b>`).join('<br>')+'<br><small>(әр қате +5 сек)</small>';
    const r=$('#frow');r.innerHTML='';const a=el('button','btn g','🔁 Қайтадан');a.onclick=()=>duel(g,l);const b=el('button','btn','Деңгей таңдау');b.onclick=()=>duelMenu(g);const m=el('button','btn','🗺️ Карта');m.onclick=goHome;r.append(a,b,m);
    $('#final').classList.add('on');beep('win');confetti()},700)};
  const sides=[0,1].map(si=>{const tasks=g.make(l).slice(0,N);let i=0,err=0;
    const side=el('div','dside s'+si,`<div class="dh"><b>${si?'🔵 2-оқушы':'🔴 1-оқушы'}</b><span class="dclk">0.0</span></div><div class="dots"></div><div class="tbox"></div>`);wrap.append(side);
    const dots=side.querySelector('.dots'),box=side.querySelector('.tbox'),clk=side.querySelector('.dclk');
    const step=()=>{if(!alive(id))return;dots.innerHTML='';tasks.forEach((_,j)=>dots.append(el('i',j<i?'d':j===i?'c':'')));box.innerHTML='';
      if(i>=N){const tm=(performance.now()-t0)/1000;res[si]={tm,err,score:tm+err*5};clk.textContent=fmtT(tm);box.innerHTML=`<div class="ddone">🏁<br>${fmtT(tm)} сек<br><small>Қате: ${err}</small></div>`;beep('ok');check();return}
      let fired=false;g.render(tasks[i],box,()=>{if(fired||!alive(id))return;fired=true;beep('ok');i++;setTimeout(step,(g.delay||900)-200)},()=>{err++},id,i,N)};
    step();return{clk,si}});
  iv=setInterval(()=>{if(!alive(id))return clearInterval(iv);const t=(performance.now()-t0)/1000;sides.forEach(x=>{if(!res[x.si])x.clk.textContent=fmtT(t)})},100)}
drawHome();
</script>
