<!doctype html>
<html lang="kk" translate="no">
<head>
<meta name="google" content="notranslate">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>neuroUstaz · Ойындар</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--blue:#1e88e5;--red:#e53935;--green:#43a047;--yellow:#fdd835;--ink:#1a2a5a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,#29a3f5,#1565c0);user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;touch-action:manipulation;color:inherit}
.screen{display:none;min-height:100vh;flex-direction:column}
.screen.active{display:flex}

/* HOME */
.home-head{text-align:center;padding:28px 16px 4px;color:#fff;position:relative}
.home-head h1{font-size:clamp(38px,5vw,68px);font-weight:900;text-shadow:0 5px 0 rgba(0,0,0,.2);letter-spacing:.5px}
.home-head p{font-size:clamp(20px,2.2vw,28px);font-weight:800;opacity:.92}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:26px;padding:24px clamp(16px,4vw,64px) 48px;max-width:1600px;margin:0 auto;width:100%}
.gcard{background:#fff;border-radius:30px;padding:26px 16px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:0 9px 0 rgba(0,0,0,.18);transition:transform .12s}
.gcard:active{transform:translateY(7px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.gcard .ic{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;font-size:64px}
.gcard .t{font-size:26px;font-weight:900;text-align:center;line-height:1.15}
.gcard .s{font-size:17px;font-weight:700;opacity:.6;text-align:center;line-height:1.2}
.fs-btn{position:absolute;right:24px;top:24px}

/* GAME */
.topbar{display:flex;align-items:center;gap:14px;padding:16px 22px 6px;color:#fff}
.tbtn{background:#fff;color:var(--ink);font-size:24px;font-weight:900;padding:14px 22px;border-radius:18px;box-shadow:0 6px 0 rgba(0,0,0,.2);white-space:nowrap}
.tbtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.ttitle{flex:1;text-align:center;font-size:clamp(26px,3vw,42px);font-weight:900;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.progress{display:flex;gap:10px;justify-content:center;padding:6px 16px;min-height:34px}
.progress i{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.35);transition:.2s}
.progress i.done{background:var(--yellow)}
.progress i.cur{background:#fff;transform:scale(1.3)}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:12px 20px 28px}
.task-title{color:#fff;font-size:clamp(30px,3.4vw,50px);font-weight:900;text-align:center;text-shadow:0 4px 0 rgba(0,0,0,.25);line-height:1.15}
.tiles{display:flex;gap:22px;flex-wrap:wrap;justify-content:center}
.tile{min-width:124px;height:124px;padding:0 22px;background:#fff;border-radius:24px;font-size:66px;font-weight:900;color:var(--ink);box-shadow:0 8px 0 #8aa2cc;display:grid;place-items:center;line-height:1}
.tile:active{transform:translateY(6px);box-shadow:0 2px 0 #8aa2cc}
.tile.used{visibility:hidden}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-16px)}40%,80%{transform:translateX(16px)}}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.18)}100%{transform:scale(1)}}
.speak{background:#fff;border-radius:50%;width:84px;height:84px;font-size:42px;box-shadow:0 6px 0 #8aa2cc;display:grid;place-items:center}
.speak:active{transform:translateY(4px);box-shadow:0 2px 0 #8aa2cc}
.row{display:flex;align-items:center;gap:24px;justify-content:center;flex-wrap:wrap}

/* house */
.house{display:flex;flex-direction:column;align-items:center}
.roof{width:400px;height:128px;background:var(--red);clip-path:polygon(50% 0,100% 100%,0 100%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;color:#fff;font-size:68px;font-weight:900}
.hbody{width:340px;border:9px solid var(--red);border-top-width:0;background:#d4ebfc}
.hrow{display:flex;justify-content:space-around;align-items:center;height:86px;border-top:7px solid var(--red)}
.hc{width:104px;height:70px;font-size:56px;font-weight:900;display:grid;place-items:center;border-radius:14px}
.hc.empty{background:#fff;border:4px dashed #9fb3d6}
.hc.ex{color:#2e7d32}
.hrow.example{background:#e3f6e1}
.hc.empty.over{background:#fff59d;border:5px solid #f9a825}
.tile.dragging{position:relative;z-index:50;pointer-events:none;box-shadow:0 18px 30px rgba(0,0,0,.3)}
.howto{color:#fff;font-size:28px;font-weight:900;background:rgba(0,0,0,.18);padding:8px 22px;border-radius:16px}
.drop.over{box-shadow:0 0 0 9px #fdd835 !important;transform:scale(1.06)}
.box.big{width:150px;height:150px;font-size:90px;font-weight:900}
.cbtn.dragging{position:relative;z-index:50;pointer-events:none}
.firstw .blank{min-height:110px;border-radius:12px 12px 0 0}
.firstw .blank.drop{background:rgba(255,255,255,.2)}
.rtext{background:#fff;border-radius:30px;padding:26px 50px;font-size:clamp(32px,2.8vw,48px);line-height:1.5;font-weight:800;max-width:1550px;color:var(--ink);box-shadow:0 10px 0 rgba(0,0,0,.15)}
.rtext h3{text-align:center;color:var(--red);font-size:1.2em;margin-bottom:6px}
.sclock{font-size:46px;font-weight:900;color:#fff;background:rgba(0,0,0,.22);padding:4px 24px;border-radius:16px;font-variant-numeric:tabular-nums;min-width:120px;text-align:center}
.duel{display:flex;gap:24px;width:100%;align-self:stretch;flex:1}
.side{flex:1;border-radius:30px;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.side.s0{background:rgba(229,57,53,.28);border:6px solid #ef5350}.side.s1{background:rgba(67,160,71,.28);border:6px solid #66bb6a}
.shead{font-size:42px;font-weight:900;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.sdots{display:flex;gap:8px}.sdots i{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.35)}.sdots i.done{background:var(--yellow)}.sdots i.cur{background:#fff}
.seq{display:flex;align-items:center;gap:18px;font-size:84px;font-weight:900;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.25);min-height:150px}
.sdone{font-size:64px}
.bins{display:flex;gap:26px;flex-wrap:wrap;justify-content:center}
.bin{min-width:320px;min-height:200px;border-radius:30px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px;border:6px solid #fff;box-shadow:0 9px 0 rgba(0,0,0,.2);cursor:pointer}
.bl{font-size:42px;font-weight:900;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.bc{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:420px}
.chip{background:#fff;border-radius:12px;padding:4px 14px;font-size:34px;font-weight:900}
.tile.picked{box-shadow:0 0 0 9px #fdd835}
.tile.wide{font-size:48px}
.eq.conv{font-size:clamp(56px,5vw,84px);flex-wrap:wrap;justify-content:center}
.box.wide{width:auto;min-width:220px;padding:0 20px;font-size:.85em}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:30px;padding:40px clamp(16px,4vw,80px);max-width:1600px;margin:0 auto;width:100%}
.gradecard{border-radius:36px;padding:34px 10px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 10px 0 rgba(0,0,0,.22);border:6px solid rgba(255,255,255,.85)}
.gradecard:active{transform:translateY(8px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.gradecard .gn{font-size:clamp(90px,10vw,160px);font-weight:900;line-height:1;text-shadow:0 6px 0 rgba(0,0,0,.2)}
.gradecard .gt{font-size:clamp(30px,3vw,46px);font-weight:900;letter-spacing:2px}
.gradecard .gc{font-size:24px;font-weight:800;background:rgba(0,0,0,.18);padding:4px 18px;border-radius:14px;margin-top:6px}
.gradebar{display:flex;align-items:center;justify-content:space-between;padding:10px clamp(16px,4vw,64px) 0;max-width:1600px;margin:0 auto;width:100%}
.gradebar span{width:200px}
.gname{color:#fff;font-size:clamp(36px,4vw,56px);font-weight:900;text-shadow:0 4px 0 rgba(0,0,0,.2)}
.soon{grid-column:1/-1;text-align:center;color:#fff;font-size:40px;font-weight:900;padding:60px}
@media (max-width:900px){.grades{grid-template-columns:repeat(2,1fr)}}
.eqcard{background:#fff;border-radius:30px;padding:24px 60px;font-size:clamp(80px,8vw,130px);font-weight:900;color:var(--ink);box-shadow:0 10px 0 rgba(0,0,0,.15)}
.xv{color:var(--red);font-style:italic}
.eq .xv{color:var(--yellow)}
.tscene{position:relative;width:100%;flex:1;min-height:520px;border-radius:30px;overflow:hidden;background:linear-gradient(#7dd3fc 0%,#bae6fd 55%,#fde68a 55%,#fcd34d 100%);box-shadow:inset 0 0 0 6px rgba(255,255,255,.6)}
.tscene .sun{position:absolute;right:6%;top:6%;font-size:90px}
.tscene .cl{position:absolute;font-size:110px;opacity:.9}.tscene .c1{left:10%;top:6%}.tscene .c2{left:48%;top:14%;font-size:80px}
.tscene .hills{position:absolute;left:0;right:0;bottom:30%;height:22%;background:radial-gradient(ellipse at 20% 100%,#86efac 40%,transparent 41%),radial-gradient(ellipse at 70% 100%,#4ade80 45%,transparent 46%)}
.tscene .rails{position:absolute;left:0;right:0;bottom:12%;height:22px;background:repeating-linear-gradient(90deg,#78350f 0 18px,transparent 18px 46px),linear-gradient(transparent 7px,#57534e 7px 11px,transparent 11px)}
.train{position:absolute;left:0;bottom:calc(12% + 10px);display:flex;align-items:flex-end;will-change:transform}
.wagon{position:relative;background:#2563eb;border:8px solid #1e3a8a;border-radius:18px;padding:22px 48px 44px;min-width:360px;text-align:center}
.wagon span{display:block;background:#fff;border-radius:14px;padding:6px 30px;font-size:clamp(70px,7vw,120px);font-weight:900;color:var(--red);line-height:1.1}
.wagon i{position:absolute;bottom:-34px;width:56px;height:56px;border-radius:50%;background:#111827;border:10px solid #9ca3af}
.wagon i:nth-of-type(1){left:40px}.wagon i:nth-of-type(2){right:40px}
.link{width:30px;height:12px;background:#1e293b;margin-bottom:40px}
.loco{width:300px;height:auto;margin-bottom:-24px}
.wgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:18px;width:min(1700px,96vw)}
.wcard{background:#fff;border-radius:22px;padding:18px 6px;font-size:clamp(34px,3.4vw,60px);font-weight:900;color:var(--ink);box-shadow:0 8px 0 #8aa2cc;transition:background .2s,color .2s}
.wcard:active{transform:translateY(5px);box-shadow:0 3px 0 #8aa2cc}
.wcard.ok{background:#43a047;color:#fff;box-shadow:0 8px 0 #2e7d32}
.wcard{position:relative}.wcard.ok::after{content:'✓';position:absolute;top:2px;right:12px;font-size:.55em}
.wcard.miss{opacity:.45}
.sclock.warn{background:#d32f2f;animation:pop .5s infinite alternate}
.task-title small{font-size:.6em;opacity:.9}
.fbox p small{font-size:.65em;color:#666;display:block;margin-top:8px}
.wsets{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;max-width:1500px}
.wset{background:rgba(255,255,255,.9);border-radius:22px;padding:16px 26px;font-size:28px;font-weight:900;color:var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;gap:2px;border:5px solid transparent}
.wset small{font-size:18px;opacity:.6}
.wset.on{background:#fff;border-color:var(--yellow);box-shadow:0 0 0 6px rgba(253,216,53,.5),0 6px 0 rgba(0,0,0,.18)}
.wedit{position:fixed;inset:0;background:rgba(10,30,80,.6);display:flex;align-items:center;justify-content:center;z-index:40}
.webox{background:#fff;border-radius:30px;padding:30px 36px;width:min(900px,92vw);display:flex;flex-direction:column;gap:14px}
.webox h3{font-size:40px}.webox p{font-size:22px;font-weight:700;opacity:.7}
.webox .wtitle{width:100%;font:800 30px 'Nunito',sans-serif;border:4px solid #bcd;border-radius:18px;padding:10px 14px;margin-bottom:8px;user-select:text;-webkit-user-select:text}
.webox textarea{width:100%;height:260px;font:800 32px 'Nunito',sans-serif;border:4px solid #bcd;border-radius:18px;padding:14px;user-select:text;-webkit-user-select:text}
.webox .tbtn.ok{background:var(--green);color:#fff}
.slot.filled.got{color:var(--green)}
.hrow.active .hc.empty{border:5px solid var(--yellow);box-shadow:0 0 0 7px rgba(253,216,53,.55)}

/* ten */
.dots{display:grid;grid-template-columns:repeat(5,54px);gap:14px;background:#fff;padding:18px;border-radius:22px;box-shadow:0 8px 0 rgba(0,0,0,.15)}
.dot{width:54px;height:54px;border-radius:50%;border:4px solid #e3eaf5}
.dot.r{background:var(--red)}.dot.b{background:var(--blue)}
.eq{display:flex;align-items:center;gap:20px;color:#fff;font-size:96px;font-weight:900;text-shadow:0 5px 0 rgba(0,0,0,.25)}
.box{width:124px;height:124px;border-radius:22px;background:rgba(255,255,255,.35);border:5px solid #fff;display:grid;place-items:center;color:#fff}
.box.filled{background:#fff;color:var(--ink);text-shadow:none}

/* word */
.pic{font-size:150px;line-height:1;filter:drop-shadow(0 8px 0 rgba(0,0,0,.15))}
.slots{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.slot{width:112px;height:136px;border-radius:20px;border:5px dashed rgba(255,255,255,.85);display:grid;place-items:center;font-size:76px;font-weight:900;color:#fff}
.slot.filled{border:5px solid #fff;background:#fff;color:var(--red)}
.slot.next{box-shadow:0 0 0 7px rgba(253,216,53,.7)}

/* pyramid */
.pyr{display:flex;flex-direction:column;align-items:center;gap:22px;background:rgba(255,255,255,.15);padding:28px 40px;border-radius:30px}
.prow{display:flex;gap:60px}
.pc{width:126px;height:126px;border-radius:50%;background:#fff;border:7px solid #64b5f6;font-size:64px;font-weight:900;display:grid;place-items:center;color:var(--ink)}
.pc.empty{background:#e8f4fe;border-style:dashed;color:transparent}
.pc.sel{border:7px solid var(--yellow);box-shadow:0 0 0 8px rgba(253,216,53,.55)}
.rule{background:#fff8e1;color:var(--ink);font-size:28px;font-weight:900;padding:12px 26px;border-radius:18px;text-align:center}

/* reading */
.bigbtn{font-size:46px;font-weight:900;color:#fff;padding:24px 56px;border-radius:30px;box-shadow:0 9px 0 rgba(0,0,0,.25)}
.bigbtn:active{transform:translateY(7px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.bigbtn.green{background:#2e9e44}.bigbtn.red{background:#d32f2f}
.wordcard{background:#fff;border-radius:34px;padding:40px 80px;font-size:clamp(80px,10vw,150px);font-weight:900;color:var(--blue);box-shadow:0 10px 0 rgba(0,0,0,.18);min-width:520px;text-align:center}
.timer{width:min(760px,90vw);height:30px;background:rgba(255,255,255,.3);border-radius:20px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--yellow);width:100%;transition:width 1s linear}
.counter{color:#fff;font-size:36px;font-weight:900}
.sentence{background:linear-gradient(180deg,#ffe259,#ffc93c);border-radius:34px;padding:44px 56px;font-size:clamp(60px,7vw,110px);font-weight:900;text-align:center;line-height:1.25;max-width:1300px;box-shadow:0 10px 0 rgba(0,0,0,.18);-webkit-text-stroke:2px #fff;paint-order:stroke fill}
.sentence .w0{color:var(--red)}.sentence .w1{color:#1565c0}

/* scheme */
.scheme{background:#fff;border-radius:30px;padding:30px 40px;display:flex;flex-direction:column;align-items:center;gap:20px;box-shadow:0 10px 0 rgba(0,0,0,.15)}
.scheme .lt{display:flex;gap:26px}
.scheme .lt b{width:96px;text-align:center;font-size:84px;font-weight:900;color:var(--ink)}
.scheme .sc{display:flex;gap:26px;background:#eef3fa;padding:14px 18px;border-radius:24px}
.circ{width:80px;height:80px;border-radius:50%;background:#dfe7f2;border:4px dashed #b0bfd6;margin:0 8px}
.circ.r{background:var(--red);border:4px solid #fff}.circ.b{background:var(--blue);border:4px solid #fff}
.circ.next{box-shadow:0 0 0 7px rgba(253,216,53,.8)}
.cbtn{width:150px;height:150px;border-radius:50%;border:8px solid #fff;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.cbtn:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.cbtn.picked{box-shadow:0 0 0 10px #fdd835}.circ.drop{cursor:pointer}.cbtn.r{background:var(--red)}.cbtn.b{background:var(--blue)}
.legend{color:var(--ink);background:#fff;padding:10px 26px;border-radius:18px;font-size:28px;font-weight:900;display:flex;gap:40px}
.legend span{display:flex;align-items:center;gap:10px}
.legend i{width:30px;height:30px;border-radius:50%;display:inline-block;border:3px solid #fff}

/* count / compare */
.objs{background:#fff;border-radius:30px;padding:26px;display:grid;grid-template-columns:repeat(5,92px);gap:12px;font-size:76px;line-height:92px;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.15);min-height:140px}
.cmp{display:flex;align-items:center;gap:30px}
.cmp .objs{grid-template-columns:repeat(3,80px);font-size:62px;line-height:80px;padding:20px;min-width:300px}
.sign{width:130px;height:130px;border-radius:24px;border:5px dashed #fff;display:grid;place-items:center;font-size:90px;font-weight:900;color:#fff}
.sign.filled{background:#fff;color:var(--red);border-style:solid}
.firstw{display:flex;gap:10px;font-size:96px;font-weight:900;color:#fff;text-shadow:0 5px 0 rgba(0,0,0,.25)}
.firstw .blank{width:100px;border-bottom:10px solid var(--yellow);text-align:center}
.firstw .blank.filled{color:var(--yellow)}.firstw .blank.next{background:rgba(253,216,53,.3)}

/* final */
#final{position:fixed;inset:0;background:rgba(10,30,80,.6);display:none;align-items:center;justify-content:center;z-index:20}
#final.show{display:flex}
.fbox{background:#fff;border-radius:40px;padding:44px 70px;text-align:center;box-shadow:0 14px 0 rgba(0,0,0,.25);animation:pop .5s}
.fbox .stars{font-size:90px}
.fbox h2{font-size:clamp(70px,9vw,120px);font-weight:900;color:var(--green);line-height:1.05}
.fbox p{font-size:36px;font-weight:900;margin:10px 0 26px}
.fbox .row{gap:24px}
.fbox .tbtn{font-size:30px;padding:18px 30px;background:var(--blue);color:#fff}
#flash{position:fixed;left:50%;top:18%;transform:translateX(-50%);font-size:70px;font-weight:900;color:#fff;text-shadow:0 5px 0 rgba(0,0,0,.3);pointer-events:none;opacity:0;transition:opacity .2s;z-index:15;white-space:nowrap}
#flash.show{opacity:1}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}

/* ===== ТЕЛЕФОН ===== */
.tile,.cbtn{touch-action:none}
@media (max-width:700px){
 .stage{padding:8px 10px 20px;gap:14px}
 .topbar{padding:10px 10px 4px;gap:8px}
 .tbtn{font-size:16px;padding:9px 12px;border-radius:14px}
 .ttitle{font-size:18px}
 .progress{gap:6px;min-height:22px;flex-wrap:wrap}.progress i{width:14px;height:14px}
 .home-head{padding:14px 10px 0}.home-head h1{font-size:34px}.home-head p{font-size:16px}
 .fs-btn{display:none}
 .grades{grid-template-columns:1fr 1fr;gap:14px;padding:16px 12px}
 .gradecard{padding:16px 6px;border-radius:24px;border-width:4px}.gradecard .gn{font-size:64px}.gradecard .gt{font-size:24px}.gradecard .gc{font-size:15px}
 .gradebar{padding:8px 12px 0}.gradebar span{display:none}.gname{font-size:26px}
 .grid{grid-template-columns:1fr 1fr;gap:12px;padding:12px 12px 30px}
 .gcard{padding:14px 8px;border-radius:20px;gap:6px}.gcard .ic{width:64px;height:64px;font-size:36px}.gcard .t{font-size:16px}.gcard .s{font-size:12px}
 .task-title{font-size:22px}.task-title small{font-size:.7em}
 .howto{font-size:14px;padding:6px 12px;text-align:center}
 .tiles{gap:10px}
 .tile{min-width:62px;height:62px;padding:0 10px;font-size:34px;border-radius:16px;box-shadow:0 5px 0 #8aa2cc}
 .tile.wide{font-size:22px}

const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function options(correct,count,min,max){const s=new Set([correct]);let g=0;while(s.size<count&&g++<200){const v=correct+rnd(-3,3);if(v>=min&&v<=max)s.add(v)}return shuffle([...s])}

/* ---------- sound ---------- */
let soundOn=true,AC=null;
function tone(f,d,t=0,type='sine',v=.25){AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;const n=AC.currentTime+t;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d)}
function beep(k){if(!soundOn)return;try{
  if(k==='good'){tone(660,.15);tone(880,.15,.12);tone(1320,.3,.24)}
  else if(k==='bad'){tone(180,.3,0,'square',.1)}
  else if(k==='tap'){tone(600,.1,0,'sine',.18)}
  else if(k==='win'){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.4,i*.14))}
}catch(e){}}

/* ---------- drag & tap ---------- */
function dragTile(tile,onTap,onDrop){
  tile.addEventListener('pointerdown',e=>{
    if(tile.classList.contains('used'))return;
    e.preventDefault();const sx=e.clientX,sy=e.clientY;let moved=false,over=null;
    try{tile.setPointerCapture(e.pointerId)}catch(_){}
    const target=ev=>{const t=document.elementFromPoint(ev.clientX,ev.clientY);return t&&t.closest('.drop')};
    const move=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;
      if(!moved&&Math.hypot(dx,dy)>12){moved=true;tile.classList.add('dragging')}
      if(!moved)return;tile.style.transform=`translate(${dx}px,${dy}px) scale(1.12)`;
      const t=target(ev);if(t!==over){over&&over.classList.remove('over');over=t;over&&over.classList.add('over')}};
    const up=ev=>{tile.removeEventListener('pointermove',move);tile.removeEventListener('pointerup',up);tile.removeEventListener('pointercancel',up);
      const t=moved?target(ev):null;over&&over.classList.remove('over');
      tile.style.transform='';tile.classList.remove('dragging');
      if(!moved)onTap();else if(t)onDrop(t)};
    tile.addEventListener('pointermove',move);tile.addEventListener('pointerup',up);tile.addEventListener('pointercancel',up);
  });
}

{t:'Менің отбасым',b:'Менің атым Әли. Мен жеті жастамын. Біздің отбасымыз үлкен. Менің әкем, анам, атам, апам, әпкем және кішкентай інім бар. Әкем – жүргізуші. Ол күнде таңертең жұмысқа ерте кетеді. Анам – мұғалім. Ол мектепте балаларды оқытады. Кешке анам дәмді тамақ пісіреді. Мен анама көмектесемін. Дастарқанға нан мен шай қоямын. Атам мен апам бізбен бірге тұрады. Атам маған ертегі айтады. Апам бауырсақ пісіреді. Оның бауырсағы өте дәмді. Әпкем Айгерім бесінші сыныпта оқиды. Ол маған сабақ дайындауға көмектеседі. Інім Нұрлан әлі кішкентай. Ол ойыншықпен ойнағанды жақсы көреді. Мен інімді ренжітпеймін. Демалыс күндері біз бәріміз бірге саябаққа барамыз. Онда әткеншек тебеміз, балмұздақ жейміз. Кешке үйге қайтып, бірге шай ішеміз. Мен отбасымды қатты жақсы көремін. Жазда біз ауылға барып, туыстарымызды көреміз. Ауылда нағашы атам мен нағашы апам тұрады. Олар бізді көргенде қатты қуанады. Мен нағашы атамның атына мінемін. Қыста біз үйде отырып, бірге ойын ойнаймыз. Анам маған: «Отбасың – сенің қорғаның», – дейді. Отбасы – менің бақытым.'},
{t:'Ақтөс',b:'Біздің үйде кішкентай күшік бар. Оның аты – Ақтөс. Ақтөстің жүні қара, ал төсі аппақ. Сондықтан оны Ақтөс деп атадық. Күшікті маған туған күніме атам сыйлады. Мен оған өте қуандым. Ақтөс таңертең ерте оянады. Ол менің бөлмеме келіп, мені оятады. Мен оған тамақ беремін. Ақтөс сүт пен ет жегенді жақсы көреді. Түстен кейін біз аулада ойнаймыз. Мен допты лақтырамын, ал Ақтөс оны жүгіріп әкеледі. Ол өте жылдам жүгіреді. Кейде Ақтөс мысықты қуып кетеді. Бірақ мысық ағашқа шығып кетеді. Ақтөс төменде тұрып үреді. Кешке күшігім шаршайды. Ол өз орнына жатып ұйықтайды. Түнде Ақтөс үйімізді күзетеді. Бөтен адам келсе, ол қатты үреді. Ақтөс – менің ең жақсы досым. Мен оған қамқор боламын. Оны жуындырып, таза ұстаймын. Ақтөс те мені жақсы көреді. Мен мектептен келгенде, ол есіктің алдында күтіп тұрады. Мені көргенде құйрығын бұлғап, айнала секіреді. Қыста біз екеуміз қарда ойнаймыз. Ақтөс қарды жегенді ұнатады. Анам: «Күшік – үйдің күзетшісі», – дейді. Мен Ақтөсімді ешқашан ренжітпеймін.'},
{t:'Мектеп',b:'Мен биыл бірінші сыныпқа бардым. Біздің мектеп үлкен әрі әдемі. Мектептің алдында гүлдер өседі. Бірінші қыркүйекте анам мені мектепке апарды. Мен жаңа киім кидім, қолыма гүл ұстадым. Сол күні біз мұғаліммен таныстық. Біздің мұғаліміміздің аты – Әсем апай. Ол өте мейірімді. Әсем апай бізге әріп пен санды үйретеді. Біз оқуды, жазуды үйреніп жатырмыз. Сабақта мен қолымды көтеріп жауап беремін. Дұрыс жауап берсем, апай мені мақтайды. Біздің сыныпта жиырма бала оқиды. Менің жаңа достарым көп. Үзілісте біз бірге ойнаймыз. Кейде асханаға барып, тамақ ішеміз. Мектепте кітапхана да бар. Онда кітап көп. Мен кітапханадан ертегі кітабын алдым. Сабақтан кейін үйге келіп, үй тапсырмасын орындаймын. Мен мектепті жақсы көремін. Мен жақсы оқып, көп білім алғым келеді. Бізде дене шынықтыру сабағы да бар. Онда біз жүгіреміз, секіреміз, доп ойнаймыз. Музыка сабағында ән саламыз. Еңбек сабағында қағаздан әдемі гүл жасаймыз. Мен өскенде дәрігер болғым келеді. Ол үшін қазір жақсы оқуым керек.'},
{t:'Көктем',b:'Қыс өтіп, көктем келді. Күн жылынып, аспан ашық болды. Күн көзі жарқырап тұр. Қар ери бастады. Көшеде кішкентай бұлақтар ағады. Балалар суға қағаз қайық жүргізеді. Ағаштар бүршік жарды. Көп ұзамай жап-жасыл жапырақтар шықты. Жерден көк шөп көктеді. Алғашқы гүлдер ашылды. Олардың түсі сары, қызыл, көк. Жылы жақтан құстар ұшып келді. Қарлығаштар ұя салды. Құстар таңертеңнен әндетеді. Ара мен көбелектер гүлден гүлге қонады. Көктемде ауылда жұмыс көп. Адамдар жерді жыртып, егін егеді. Бақшаға көкөніс отырғызады. Мен атама бақшада көмектестім. Біз сәбіз бен қияр ектік. Көктемде Наурыз мерекесі болады. Біз наурыз көже ішеміз. Барлығы бір-бірін құттықтайды. Мен көктемді өте жақсы көремін. Көктемде күн ұзарады, түн қысқарады. Балалар далада ұзақ ойнайды. Біз велосипед тебеміз, доп ойнаймыз. Кейде жаңбыр жауып, аспанда кемпірқосақ шығады. Ол өте әдемі болады. Кемпірқосақта жеті түс бар. Мен оны суретке саламын. Көктем – жаңару мезгілі.'},
{t:'Алма ағашы',b:'Атамның үлкен бағы бар. Бақта көп ағаш өседі. Ең әдемі ағаш – алма ағашы. Оны атам көп жыл бұрын отырғызған. Көктемде алма ағашы гүлдейді. Оның гүлдері аппақ әрі хош иісті. Гүлдерге аралар ұшып келеді. Жазда ағашта кішкентай жасыл алмалар пайда болады. Атам ағашқа күнде су құяды. Мен де атама көмектесемін. Шелекпен су тасимын. Күзде алмалар піседі. Олар үлкен, қызыл әрі тәтті болады. Біз бүкіл отбасымызбен алма тереміз. Әкем баспалдақпен жоғары шығады. Мен төменде тұрып, себетті ұстаймын. Апам алмадан тосап жасайды. Анам алмадан бәліш пісіреді. Біз алманы көршілерімізге де береміз. Атам маған: «Ағашты күтсең, ол саған жеміс береді», – деді. Мен де өскенде бақ отырғызамын. Қыста ағаш демалады. Оның бұтақтарына қар жиналады. Атам ағашты суықтан қорғау үшін түбін орап қояды. Құстар бұтаққа қонып, дән іздейді. Мен құстарға жем саламын. Көктем келгенде, ағаш қайтадан гүлдейді. Мен алма ағашын өте жақсы көремін.'},
{t:'Жаз',b:'Жаз келді. Мектепте сабақ бітті. Ұзақ демалыс басталды. Біз отбасымызбен ауылға бардық. Ауылда атам мен әжем тұрады. Олар бізді қуанып қарсы алды. Ауылдың ауасы таза. Айнала жап-жасыл. Ауылдың шетінде үлкен өзен ағады. Мен күнде досым Ерланмен өзенге барамын. Біз суға шомыламыз, жағада ойнаймыз. Атам маған балық аулауды үйретті. Мен бірінші рет үлкен балық ұстадым. Әжем ол балықты қуырып берді. Ауылда мал көп. Әжем сиыр сауады. Мен бұзауға шөп беремін. Кейде атаммен бірге атқа мінемін. Ат өте ақылды жануар. Кешке барлығымыз далада отырып шай ішеміз. Аспанда жұлдыздар жарқырайды. Атам маған жұлдыздар туралы әңгіме айтады. Жаз өте тез өтіп кетті. Мен ауылды сағынамын. Үйге қайтарда әжем бізге құрт пен ірімшік салып берді. Атам мені құшақтап, маңдайымнан сүйді. Мен оларға: «Сау болыңыздар! Мен сіздерді сағынамын!» – дедім. Қалаға келген соң, мен досыма ауыл туралы айтып бердім. Келесі жазда тағы барамын.'},
{t:'Қоян',b:'Орманда кішкентай ақ қоян тұрады. Оның құлағы ұзын, құйрығы қысқа. Қоянның аяқтары мықты. Ол өте жылдам жүгіреді және алысқа секіреді. Жазда қоянның жүні сұр болады. Ал қыста оның жүні аппақ болады. Сондықтан қыста оны қардан көру қиын. Бұл қоянды қасқыр мен түлкіден қорғайды. Қоян шөп, жапырақ жейді. Ол сәбіз бен қырыққабатты өте жақсы көреді. Қыста ағаштың қабығын кеміреді. Қоян өте сақ жануар. Ол кішкене дыбысты да естиді. Қауіп төнсе, бірден қашып кетеді. Бір күні қоян орманда серуендеп жүрді. Кенет бұтаның артынан түлкі шықты. Қоян қорқып кетті. Бірақ ол тез жүгіріп, інге кіріп кетті. Түлкі оны ұстай алмады. Қоян інінде тыныш отырды. Кешке ол балаларына оралды. Олар бірге ұйықтады. Қоянның балалары кішкентай әрі әлсіз. Анасы оларды сүтімен асырайды. Балалары тез өседі. Бір айдан кейін олар өздері шөп жей бастайды. Анасы оларға жылдам жүгіруді үйретеді. Көп ұзамай кішкентай қояндар да қасқыр мен түлкіден қашып құтыла алады.'},
{t:'Досым',b:'Менің досым – Арман. Біз бір үйде тұрамыз. Арман екеуміз бір сыныпта оқимыз. Біз бір партада отырамыз. Арман өте ақылды әрі мейірімді бала. Ол математиканы жақсы біледі. Кейде маған есеп шығаруға көмектеседі. Мен оған сурет салуды үйретемін. Бір күні мен қаламымды үйде ұмытып кеттім. Арман маған өз қаламын берді. Мен оған рахмет айттым. Сабақтан кейін біз бірге үйге қайтамыз. Жолда әңгімелесеміз. Демалыс күндері біз аулада доп ойнаймыз. Қыста шана тебеміз, аққала жасаймыз. Бірде Арман ауырып қалды. Ол мектепке келмеді. Мен оның үйіне бардым. Оған сабақты түсіндіріп бердім. Арман қатты қуанды. Достар бір-біріне көмектесуі керек. Біз ешқашан ұрыспаймыз. Егер ренжісек, тез татуласамыз. Мен Арманмен дос болғаныма қуаныштымын. Мен досымның туған күніне сыйлық дайындадым. Оған өзім салған суретті сыйладым. Суретте біз екеуміз доп ойнап жүрміз. Арман сыйлыққа қатты қуанды. Ол суретті бөлмесінің қабырғасына ілді. Атам маған: «Жүз сомың болғанша, жүз досың болсын», – деді. Нағыз дос – үлкен байлық.'},
{t:'Нан',b:'Нан – ең қымбат ас. Біз нанды күнде жейміз. Бірақ нан дастарқанға оңайлықпен келмейді. Көктемде диқан жерді жыртады. Содан кейін егін егеді. Жаңбыр жауып, күн жылытады. Егін өсіп, жайқалып тұрады. Күзде бидай піседі. Диқан бидайды орып, жинайды. Бидайды диірменге апарады. Диірменде бидайдан ұн жасайды. Ұнды наубайханаға жеткізеді. Наубайшы ұннан қамыр илейді. Қамырдан нан пісіреді. Таңертең дүкенге жып-жылы нан келеді. Анам дүкеннен нан сатып алады. Біздің үйде апам да нан пісіреді. Оның таба наны өте дәмді. Апам маған: «Нанды қоқысқа тастама, нанды баспа», – дейді. Себебі нанға көп адамның еңбегі сіңген. Мен нанды құрметтеймін. Нанды ысырап етпеймін. Дастарқаннан нанның қиқымын да жинап аламын. Нанды бір қолмен үзбейді, екі қолмен сындырады. Нанды төңкеріп қоймайды. Қонақ келсе, алдымен нан ұсынады. Біздің халық нанды киелі ас деп санайды. Атам нан туралы көп мақал біледі. Ол маған: «Нан – дастарқан көркі», – дейді. Мен бұл сөзді есіме сақтадым. Нан – береке.'},
{t:'Күз',b:'Жаз өтіп, күз келді. Ауа салқындады. Күн бұрынғыдай қатты қыздырмайды. Аспанды сұр бұлт жапты. Жиі жаңбыр жауады. Ағаштардың жапырақтары сарғайды. Кейбір жапырақтар қызарып кетті. Жел соққанда жапырақтар жерге түседі. Жер сары кілем жайғандай әдемі болды. Мен жапырақтарды жинап, гүлшоқ жасадым. Құстар жылы жаққа ұша бастады. Тырналар аспанда тізіліп ұшады. Аю қысқы ұйқыға дайындалады. Тиін жаңғақ жинап, ағаш қуысына тығады. Күзде бақта жеміс-жидек піседі. Алма, алмұрт, жүзім жинаймыз. Бақшадан картоп пен сәбіз аламыз. Күз – молшылық мезгілі. Біз күзде жылы киімдерімізді киеміз. Қолшатыр алып жүреміз. Күзде мектепте оқу басталады. Біз жаңа білім аламыз. Күз маған өте ұнайды. Күздің түстері әдемі. Күзде біз сыныппен саябаққа бардық. Мұғалім бізге ағаштардың атын айтып берді. Біз емен, қайың, терек ағаштарын көрдік. Әр балаға бір жапырақтан жинап алдық. Сыныпқа келіп, жапырақтардан сурет жасадық. Мұғалім біздің жұмысымызды мақтады. Мен күзді жақсы көремін.'}];

function eqTask(){const k=rnd(0,3);let a,b,c,txt,ans;

  else{a=rnd(5,20);ans=rnd(1,a-1);c=a-ans;trap=a+c;txt=`${a} − х = ${c}`}
  /* қате амал (қосудың орнына азайту, т.б.) нұсқасы + жақын сан */
  const opts=[ans];if(trap!==ans)opts.push(trap);

    const b=el('button','wset'+(w.id===cur?' on':''),`${w.name}<small>${n?n+' сөз':'бос — толтыр'}</small>`);
    b.onclick=()=>{if(w.id==='mine'&&(!n||cur==='mine'))return editMine(()=>{cur='mine';save();draw()});cur=w.id;save();draw()};box.append(b)});
    if(cur==='mine'&&myWords().length){const e=el('button','tbtn','✏️ Сөздерді өзгерту');e.onclick=()=>editMine(draw);box.append(e)}
    onPick&&onPick(cur)};
  const save=()=>{try{localStorage.setItem('nu_wset',cur)}catch(e){}};
  go.onclick=()=>{const list=WORDSETS.find(w=>w.id===cur).get();if(!list.length)return editMine(()=>{cur='mine';draw()});onStart(list)};
  draw()}
function editMine(after){

  <textarea spellcheck="false"></textarea><div class="row"><button class="tbtn ok">💾 Сақтау</button><button class="tbtn no">✖ Болдырмау</button></div></div>`);
  document.body.append(ov);const ta=ov.querySelector('textarea');ta.value=myWords().join(', ');setTimeout(()=>ta.focus(),50);
  ov.querySelector('.no').onclick=()=>ov.remove();
  ov.querySelector('.ok').onclick=()=>{const w=[...new Set(ta.value.split(/[,\n;]+/).map(x=>x.trim()).filter(Boolean))].slice(0,30)
    .map(x=>x.charAt(0).toLocaleUpperCase('kk')+x.slice(1));
    try{localStorage.setItem('nu_mywords',JSON.stringify(w))}catch(e){alert('Сақтау мүмкін болмады');return}
    ov.remove();after&&after()}}

/* duel tasks: 1-деңгей — 10 көлемінде, 2-деңгей — 11..20 */
function duelTask(LV){let a,b,op;
  if(LV===1){if(Math.random()<.5){op='+';a=rnd(1,9);b=rnd(1,10-a)}else{op='−';a=rnd(2,10);b=rnd(1,a-1)}}
  else{if(Math.random()<.5){op='+';const sum=rnd(11,20);a=rnd(Math.max(1,sum-10),Math.min(13,sum-1));b=sum-a}
       else{op='−';a=rnd(11,20);b=rnd(1,10)}}
  return{a,b,op,ans:op==='+'?a+b:a-b}}

/* pyramid helpers: 0=1+2, 1=3+4, 2=4+5 */
const REL=[[0,1,2],[1,3,4],[2,4,5]];
function solvable(hid){const unk=new Set(hid);let ch=true;while(ch&&unk.size){ch=false;for(const r of REL){const u=r.filter(i=>unk.has(i));if(u.length===1){unk.delete(u[0]);ch=true}}}return unk.size===0}
function canSolve(i,hid){return REL.some(r=>r.includes(i)&&r.filter(j=>hid.includes(j)).length===1)}

/* ---------- engine ---------- */
const S={game:null,tasks:[],i:0};let token=0;
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id))}
function drawProgress(){const p=$('#progress');p.innerHTML='';if(S.game.noProgress)return;S.tasks.forEach((_,i)=>p.append(el('i',i<S.i?'done':i===S.i?'cur':'')))}
function startGame(g){stopConfetti();S.game=g;S.tasks=g.make();S.i=0;$('#gtitle').textContent=g.title;$('#final').classList.remove('show');show('game');renderTask()}
function renderTask(){const my=++token;drawProgress();const st=$('#stage');st.innerHTML='';
  S.game.render(S.tasks[S.i],st,msg=>{if(my!==token)return;token++;
    if(S.game.noProgress)return finish(msg);
    beep('good');flash('Дұрыс! 👍');setTimeout(()=>{if(token!==my+1)return;S.i++;S.i>=S.tasks.length?finish():renderTask()},1300)},
    ()=>my===token)}
function finish(msg){S.i=S.tasks.length;drawProgress();$('#fmsg').innerHTML=msg||'Барлық тапсырма орындалды!';$('#final').classList.add('show');beep('win');confetti()}
function restart(){startGame(S.game)}
function goHome(){token++;stopConfetti();$('#final').classList.remove('show');show('home');if(S.game&&S.game.grade)openGrade(S.game.grade)}
function toggleFS(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}

function openGrade(n){curGrade=n;$('#grades').style.display='none';$('#gradebar').style.display='flex';$('#gname').textContent=n+'-СЫНЫП';
  const grid=$('#grid');grid.innerHTML='';const list=GAMES.filter(g=>g.grade===n);
  if(n===3){const c=el('a','gcard',`<div class="ic" style="background:#d1c4e9">🚀</div><div class="t">Көбейту әлемі</div><div class="s">8 ойын: көбейту мен бөлу</div>`);c.href='https://nurikiitu.github.io/neuroustaz-games/kobeytu/';c.style.textDecoration='none';c.style.color='inherit';grid.append(c)}
  else if(!list.length)grid.append(el('div','soon','🛠 Жақында ойындар қосылады!'));
  list.forEach(g=>{const c=el('button','gcard',`<div class="ic" style="background:${g.bg}">${g.icon}</div><div class="t">${g.title}</div><div class="s">${g.sub}</div>`);c.onclick=()=>{beep('tap');startGame(g)};grid.append(c)})}
GRADES.forEach(G=>{const k=GAMES.filter(g=>g.grade===G.n).length;
  const b=el('button','gradecard',`<div class="gn">${G.n}</div><div class="gt">СЫНЫП</div><div class="gc">${G.n===3?'8 ойын':k?k+' ойын':'жақында'}</div>`);
  b.style.background=G.c;b.onclick=()=>{beep('tap');openGrade(G.n)};$('#grades').append(b)});
/* жеке сілтеме: ?s=1 немесе /1/ — тек сол сынып ашылады */
