<!doctype html>
<html lang="kk" translate="no">
<head>
<meta name="google" content="notranslate">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Көбейту әлемі · neuroUstaz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1b4b;--yel:#ffd23f;--pink:#ff4d8d;--grn:#2ecc71;--red:#ff4757;--blu:#3fa9ff;--pur:#8e5cff;--org:#ff9f1a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:#fff;background:#140f3a;overflow-x:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:
 radial-gradient(2px 2px at 10% 20%,#fff9 50%,transparent 51%),radial-gradient(2px 2px at 30% 70%,#fff7 50%,transparent 51%),
 radial-gradient(1.5px 1.5px at 55% 30%,#fff8 50%,transparent 51%),radial-gradient(2px 2px at 80% 15%,#fff9 50%,transparent 51%),
 radial-gradient(1.5px 1.5px at 90% 60%,#fff7 50%,transparent 51%),radial-gradient(2px 2px at 70% 85%,#fff8 50%,transparent 51%),
 radial-gradient(1.5px 1.5px at 20% 90%,#fff6 50%,transparent 51%),radial-gradient(1.5px 1.5px at 45% 50%,#fff5 50%,transparent 51%),
 radial-gradient(900px 500px at 15% 0%,#5a2fb0aa,transparent 70%),radial-gradient(800px 500px at 100% 100%,#c2368a88,transparent 70%),
 linear-gradient(160deg,#140f3a,#2b1766 55%,#3d1a6e)}
button{font-family:inherit;border:none;cursor:pointer;color:inherit;touch-action:manipulation}
.screen{display:none;min-height:100vh;flex-direction:column}.screen.on{display:flex}

/* HOME */
.hero{text-align:center;padding:30px 16px 4px;position:relative}
.hero h1{font-size:clamp(40px,6vw,86px);font-weight:900;line-height:1.05;background:linear-gradient(90deg,#ffd23f,#ff7eb3,#a98bff,#5cc8ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.hero p{font-size:clamp(18px,2vw,26px);font-weight:800;opacity:.85;margin-top:4px}
.toplink{position:absolute;left:18px;top:18px;z-index:10}
.setbox{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 12px 4px}
.setbox .lb{font-weight:900;font-size:clamp(17px,1.8vw,22px);opacity:.9}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.12);font-weight:900;font-size:clamp(18px,2vw,24px);border:3px solid rgba(255,255,255,.2)}
.chip.on{background:var(--yel);color:var(--ink);border-color:#fff}
.sec{max-width:1500px;margin:0 auto;width:100%;padding:6px clamp(14px,3vw,48px)}
.sec h2{font-size:clamp(20px,2.3vw,30px);font-weight:900;margin:16px 4px 10px;opacity:.95}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;padding-bottom:10px}
.card{border-radius:28px;padding:20px 18px;text-align:left;display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 9px 0 rgba(0,0,0,.3);border:3px solid rgba(255,255,255,.35)}
.card:active{transform:translateY(6px);box-shadow:0 3px 0 rgba(0,0,0,.3)}
.card .ic{font-size:clamp(48px,5vw,66px);filter:drop-shadow(0 4px 0 rgba(0,0,0,.2))}
.card .t{font-size:clamp(21px,2.1vw,27px);font-weight:900;line-height:1.1}
.card .s{font-size:clamp(14px,1.4vw,17px);font-weight:800;opacity:.92;margin-top:4px}
.foot{text-align:center;opacity:.6;font-weight:800;padding:20px}

/* GAME */
.top{display:flex;align-items:center;gap:10px;padding:12px 16px 4px}
.btn{background:#fff;color:var(--ink);font-weight:900;font-size:clamp(16px,1.8vw,22px);padding:12px 18px;border-radius:16px;box-shadow:0 5px 0 rgba(0,0,0,.35);white-space:nowrap}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.y{background:var(--yel)}.btn.g{background:var(--grn);color:#fff}.btn.p{background:var(--pur);color:#fff}
.btn:disabled{opacity:.4}
.gt{flex:1;text-align:center;font-size:clamp(20px,2.8vw,38px);font-weight:900}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:8px 16px 20px;position:relative;width:100%}
.title{font-size:clamp(24px,3.2vw,46px);font-weight:900;text-align:center;line-height:1.15}
.q{font-size:clamp(46px,6.5vw,104px);font-weight:900;text-align:center;line-height:1.05;text-shadow:0 5px 0 rgba(0,0,0,.3)}
.opts{display:flex;gap:clamp(10px,1.6vw,22px);flex-wrap:wrap;justify-content:center}
.opt{min-width:clamp(84px,9vw,150px);height:clamp(76px,9vw,130px);padding:0 18px;background:#fff;color:var(--ink);border-radius:24px;font-size:clamp(34px,4.4vw,64px);font-weight:900;box-shadow:0 8px 0 #9d8fd6}
.opt:active{transform:translateY(6px);box-shadow:0 2px 0 #9d8fd6}
.opt.ok{background:var(--grn);color:#fff;box-shadow:0 8px 0 #1e9e55}
.opt.no{background:var(--red);color:#fff;box-shadow:0 8px 0 #c0303d}
.opt:disabled{opacity:.55}
.dots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.dots i{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.25)}.dots i.d{background:var(--yel)}.dots i.c{background:#fff;transform:scale(1.25)}
.hud{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;max-width:1400px}
.pill{background:rgba(0,0,0,.28);border-radius:16px;padding:8px 16px;font-size:clamp(20px,2.4vw,32px);font-weight:900;white-space:nowrap}
.startbox{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;max-width:900px}
.startbox p{font-size:clamp(18px,2vw,26px);font-weight:800;opacity:.9;line-height:1.35}
.big{font-size:clamp(26px,3vw,44px);padding:18px 40px;border-radius:24px}
.shake{animation:shake .4s}@keyframes shake{0%,100%{translate:0}20%,60%{translate:-14px}40%,80%{translate:14px}}
.pop{animation:pop .35s}@keyframes pop{0%{scale:.4}70%{scale:1.15}100%{scale:1}}

/* 1 balloons */
.sky{position:relative;flex:1;width:100%;min-height:60vh;overflow:hidden;border-radius:28px;background:linear-gradient(#5cc8ff33,#ffffff10);border:3px solid rgba(255,255,255,.15)}
.bal{position:absolute;left:0;top:0;width:clamp(84px,9vw,124px);height:clamp(104px,11vw,152px);border-radius:50% 50% 47% 53%/58% 58% 42% 42%;background:radial-gradient(circle at 32% 28%,#ffffffcc 0 9%,var(--c) 10% 100%);box-shadow:inset -8px -10px 0 rgba(0,0,0,.15);display:grid;place-items:center;will-change:transform}
.bal::after{content:'';position:absolute;left:50%;top:100%;width:2px;height:60px;background:#ffffffaa}
.bal span{font-size:clamp(30px,3.6vw,50px);font-weight:900;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.bal.boom{animation:boom .25s forwards}@keyframes boom{to{scale:1.6;opacity:0}}
.qbox{white-space:nowrap;background:#fff;color:var(--ink);border-radius:22px;padding:6px 26px;font-size:clamp(34px,4.5vw,66px);font-weight:900;box-shadow:0 6px 0 #9d8fd6}

/* 2 rocket */
.rk{display:flex;gap:28px;width:100%;max-width:1400px;flex:1;align-items:stretch}
.track{position:relative;width:clamp(150px,22vw,300px);min-height:64vh;border-radius:28px;background:linear-gradient(#0b0727,#2a1a6a);border:3px solid rgba(255,255,255,.2);overflow:hidden}
.track::before{content:'';position:absolute;left:50%;top:4%;bottom:4%;border-left:4px dashed rgba(255,255,255,.25)}
.planet{position:absolute;left:50%;translate:-50% 50%;display:flex;flex-direction:column;align-items:center;font-weight:900;font-size:clamp(14px,1.4vw,18px)}
.planet b{font-size:clamp(34px,4vw,56px);line-height:1}
.planet.got b{filter:drop-shadow(0 0 12px #ffd23f)}
.rocket{position:absolute;left:50%;font-size:clamp(46px,5vw,72px);translate:-50% 50%;transition:bottom .6s cubic-bezier(.3,1.4,.6,1);z-index:2}
.rocket i{position:absolute;left:50%;top:88%;translate:-50% 0;font-style:normal;font-size:.5em;animation:fl .15s infinite alternate}
@keyframes fl{to{scale:1.3 1.5}}
.rot{display:inline-block;rotate:-45deg}
.panel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.fuel{width:min(620px,90%);height:34px;border-radius:20px;background:rgba(0,0,0,.35);overflow:hidden;position:relative;border:3px solid rgba(255,255,255,.3)}
.fuel i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#2ecc71,#ffd23f);transition:width .3s}
.fuel.low i{background:linear-gradient(90deg,#ff4757,#ff9f1a)}
.fuel b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px}

/* 3 falling */
.fall{position:relative;flex:1;width:100%;max-width:1300px;min-height:50vh;overflow:hidden;border-radius:28px;background:linear-gradient(#ffffff08,#ffffff14);border:3px solid rgba(255,255,255,.15)}
.fx{position:absolute;left:0;top:0;background:#fff;color:var(--ink);font-weight:900;font-size:clamp(26px,3vw,44px);padding:8px 18px;border-radius:18px;box-shadow:0 6px 0 #9d8fd6;white-space:nowrap;will-change:transform}
.fx.boom{animation:boom .3s forwards;background:var(--grn);color:#fff}
.ground{position:absolute;left:0;right:0;bottom:0;height:14px;background:repeating-linear-gradient(90deg,#ff4757 0 30px,#c0303d 30px 60px)}
.pad{display:flex;flex-direction:column;align-items:center;gap:10px}
.disp{min-width:220px;height:clamp(60px,6.5vw,86px);border-radius:18px;background:#fff;color:var(--ink);font-size:clamp(40px,4.6vw,64px);font-weight:900;display:grid;place-items:center;padding:0 20px;box-shadow:0 6px 0 #9d8fd6}
.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.key{width:clamp(56px,6vw,86px);height:clamp(52px,5.6vw,78px);border-radius:16px;background:rgba(255,255,255,.95);color:var(--ink);font-size:clamp(26px,3vw,42px);font-weight:900;box-shadow:0 5px 0 #9d8fd6}
.key:active{transform:translateY(4px);box-shadow:0 1px 0 #9d8fd6}
.key.ok{background:var(--grn);color:#fff;box-shadow:0 5px 0 #1e9e55}.key.del{background:var(--org);color:#fff;box-shadow:0 5px 0 #c77300}

/* 4 tug */
.tug{width:100%;max-width:1500px;display:flex;flex-direction:column;gap:18px;flex:1}
.ropebox{position:relative;height:clamp(120px,15vw,180px);border-radius:28px;background:linear-gradient(#ffffff10,#ffffff20);border:3px solid rgba(255,255,255,.2);overflow:hidden}
.mv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:translate .45s cubic-bezier(.3,1.5,.6,1)}
.mv .rope{width:70%;height:16px;border-radius:10px;background:repeating-linear-gradient(60deg,#c58b4e 0 12px,#9a6532 12px 24px);position:relative}
.mv .flag{position:absolute;left:50%;top:50%;translate:-50% -62%;font-size:clamp(40px,4.4vw,60px)}
.mv .tm{font-size:clamp(34px,4vw,58px);white-space:nowrap}
.cline{position:absolute;left:50%;top:6px;bottom:6px;border-left:4px dashed #fff;opacity:.6}
.gline{position:absolute;top:6px;bottom:6px;width:8px;border-radius:4px}
.gline.L{left:calc(50% - 35%);background:#ff4757}.gline.R{left:calc(50% + 35%);background:#3fa9ff}
.teams{display:flex;gap:18px}
.team{flex:1;border-radius:28px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:14px;border:5px solid}
.team.r{background:#ff475733;border-color:#ff4757}.team.b{background:#3fa9ff33;border-color:#3fa9ff}
.team.lock{opacity:.45}
.team h3{font-size:clamp(22px,2.4vw,34px)}
.team .q{font-size:clamp(42px,5vw,80px)}
.team .opt{min-width:clamp(76px,7vw,120px);height:clamp(70px,7vw,110px);font-size:clamp(30px,3.6vw,54px)}

/* 5 millionaire */
.mil{display:flex;gap:24px;width:100%;max-width:1500px;flex:1;align-items:center}
.mmain{flex:1;display:flex;flex-direction:column;align-items:center;gap:18px}
.mq{width:100%;max-width:1000px;background:linear-gradient(#20125a,#3a1f8f);border:4px solid #a98bff;border-radius:999px;padding:20px 30px;text-align:center}
.mq small{display:block;font-size:clamp(15px,1.6vw,22px);opacity:.8;font-weight:800}
.mq div{font-size:clamp(40px,5.4vw,84px);font-weight:900}
.mopts{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:1000px}
.mo{position:relative;background:linear-gradient(#20125a,#3a1f8f);border:4px solid #a98bff;border-radius:999px;padding:14px 26px;font-size:clamp(28px,3.4vw,50px);font-weight:900;text-align:left;display:flex;gap:14px;align-items:center;overflow:hidden}
.mo b{color:var(--yel)}
.mo.sel{background:var(--org);border-color:#fff}.mo.ok{background:var(--grn);border-color:#fff}.mo.no{background:var(--red);border-color:#fff}
.mo.hide{visibility:hidden}
.mo .poll{position:absolute;right:20px;font-size:.55em;background:#fff;color:var(--ink);border-radius:12px;padding:2px 10px}
.life{display:flex;gap:12px}
.life .btn{font-size:clamp(16px,1.8vw,22px)}
.ladder{width:clamp(200px,20vw,280px);display:flex;flex-direction:column-reverse;gap:3px;background:rgba(0,0,0,.3);border-radius:20px;padding:12px}
.ladder div{display:flex;justify-content:space-between;padding:3px 12px;border-radius:10px;font-weight:900;font-size:clamp(14px,1.4vw,19px);opacity:.75}
.ladder div.safe{color:var(--yel);opacity:1}
.ladder div.cur{background:var(--org);color:#fff;opacity:1}
.ladder div.done{opacity:.4}
.mhint{font-size:clamp(20px,2.2vw,30px);font-weight:900;background:rgba(255,255,255,.15);padding:8px 18px;border-radius:16px;min-height:1em}
.mhint:empty{display:none}

/* 6 hidden picture */
.hp{display:flex;gap:28px;align-items:center;justify-content:center;width:100%;flex-wrap:wrap}
.board{position:relative;width:min(64vh,52vw);aspect-ratio:1;border-radius:24px;overflow:hidden;background:radial-gradient(#fff,#e9e2ff);box-shadow:0 10px 0 rgba(0,0,0,.3)}
.board .pic{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(min(64vh,52vw)*.78);line-height:1}
.tiles{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px}
.tile{border-radius:12px;background:linear-gradient(135deg,#6d3cf0,#c2368a);color:#fff;font-size:clamp(18px,2.2vw,32px);font-weight:900;transition:opacity .45s,scale .45s;border:3px solid rgba(255,255,255,.35)}
.tile.sel{background:linear-gradient(135deg,#ff9f1a,#ffd23f);color:var(--ink);border-color:#fff}
.tile.open{opacity:0;scale:.5;pointer-events:none}
.side{display:flex;flex-direction:column;align-items:center;gap:18px;min-width:min(420px,90vw)}
.modal{position:absolute;inset:0;background:rgba(10,6,40,.75);display:flex;align-items:center;justify-content:center;z-index:5}
.mbox{background:#fff;color:var(--ink);border-radius:30px;padding:26px;display:flex;flex-direction:column;gap:14px;align-items:center;max-width:92vw}
.mbox h3{font-size:clamp(24px,3vw,40px)}
.mbox .opts .btn{font-size:clamp(20px,2.4vw,32px);background:#efeaff}
.mbox .btn.no{background:var(--red);color:#fff}

/* 7 memory */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,1.4vw,18px);width:min(1100px,96vw)}
.mc{aspect-ratio:4/3;perspective:800px;background:none}
.mc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mc.f .in,.mc.m .in{transform:rotateY(180deg)}
.mc .fa,.mc .ba{position:absolute;inset:0;border-radius:20px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-weight:900;box-shadow:0 7px 0 rgba(0,0,0,.3)}
.mc .fa{background:linear-gradient(135deg,#6d3cf0,#c2368a);font-size:clamp(36px,4.4vw,64px);border:3px solid rgba(255,255,255,.4)}
.mc .ba{background:#fff;color:var(--ink);transform:rotateY(180deg);font-size:clamp(28px,3.6vw,56px)}
.mc.m.p0 .ba{background:#c9f7dc}.mc.m.p1 .ba{background:#ffd6dc}.mc.m.p2 .ba{background:#d4ecff}
.turn{font-size:clamp(22px,2.6vw,36px);font-weight:900;padding:6px 20px;border-radius:16px}
.turn.p1{background:var(--red)}.turn.p2{background:var(--blu)}

/* 8 maze */
.maze{display:grid;gap:clamp(5px,.8vw,10px);width:min(1000px,96vw)}
.cell{aspect-ratio:1.25;border-radius:18px;background:#fff;color:var(--ink);font-size:clamp(24px,3.2vw,48px);font-weight:900;position:relative;box-shadow:0 6px 0 #9d8fd6}
.cell.v{background:#c9f7dc;box-shadow:0 6px 0 #1e9e55}
.cell.me{background:var(--yel);box-shadow:0 6px 0 #c9a000}
.cell.bad{background:var(--red);color:#fff}
.cell.adj{outline:4px dashed #fff;outline-offset:-4px}
.cell .tk{position:absolute;top:-14px;right:-6px;font-size:.9em}

/* 9 shop */
.shop{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:1200px}
.shelf{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.tag{background:#fff;color:var(--ink);border-radius:20px;padding:10px 18px;display:flex;align-items:center;gap:10px;font-size:clamp(22px,2.6vw,36px);font-weight:900;box-shadow:0 6px 0 #9d8fd6}
.tag em{font-style:normal;font-size:1.4em}
.tag .pr{background:var(--yel);border-radius:12px;padding:2px 10px}
.basket{background:rgba(255,255,255,.12);border:3px dashed rgba(255,255,255,.4);border-radius:24px;padding:12px 20px;font-size:clamp(40px,5vw,72px);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:90px}
.wallet{font-size:clamp(24px,3vw,40px);font-weight:900;background:var(--grn);border-radius:18px;padding:8px 20px}
.sq{font-size:clamp(24px,3vw,42px);font-weight:900;text-align:center;max-width:1100px;line-height:1.25}
.opt.txt{font-size:clamp(22px,2.6vw,38px);padding:0 26px}

/* final */
#final{position:fixed;inset:0;background:rgba(10,6,40,.7);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#final.on{display:flex}
.fb{background:#fff;color:var(--ink);border-radius:36px;padding:34px 50px;text-align:center;animation:pop .45s;max-width:96vw}
.fb .st{font-size:clamp(50px,6vw,84px)}
.fb h2{font-size:clamp(50px,7vw,104px);font-weight:900;line-height:1.05}
.fb h2.w{color:var(--grn)}.fb h2.l{color:var(--pur)}
.fb p{font-size:clamp(20px,2.6vw,34px);font-weight:900;margin:10px 0 22px;line-height:1.3}
.fb .row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.fb .btn{background:var(--pur);color:#fff}
#flash{position:fixed;left:50%;top:16%;translate:-50% 0;font-size:clamp(34px,5vw,70px);font-weight:900;text-shadow:0 5px 0 rgba(0,0,0,.35);pointer-events:none;opacity:0;transition:opacity .2s;z-index:15;white-space:nowrap}
#flash.on{opacity:1}
#cf{position:fixed;inset:0;pointer-events:none;z-index:30}

@media (max-width:760px){
 .hero{padding-top:56px}.toplink{left:10px;top:10px}
 .cards{grid-template-columns:1fr;gap:12px}.card{padding:14px}
 .top{padding:10px 10px 4px}.btn{padding:9px 12px}
 .rk{flex-direction:column;gap:12px}.track{width:100%;min-height:34vh}
 .sky{min-height:58vh}
 .keys{grid-template-columns:repeat(6,1fr);gap:6px}.key{width:48px;height:48px}
 .teams{flex-direction:column;gap:10px}.team{padding:10px;gap:8px}
 .mil{flex-direction:column}.ladder{display:none}.mopts{grid-template-columns:1fr}.mq{border-radius:28px}
 .board{width:92vw}.board .pic{font-size:72vw}.side{min-width:0;width:100%}
 .mgrid{grid-template-columns:repeat(3,1fr)}
 .cell{border-radius:12px}
 .fb{padding:24px 18px}
 .qbox{white-space:nowrap;font-size:30px;padding:4px 14px}.pill{font-size:16px;padding:6px 10px}
 .life{flex-wrap:wrap;justify-content:center;gap:6px}.life .btn{font-size:14px;padding:8px 10px}
}
</style>

<canvas id="cf"></canvas>

<script>
/* ===== helpers ===== */
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);
const one=a=>a[Math.floor(Math.random()*a.length)];
const fmt=n=>n.toLocaleString('ru-RU');
const reanim=(e,c)=>{e.classList.remove(c);void e.offsetWidth;e.classList.add(c)};

/* sound */
let snd=true,AC=null;
function tone(f,d,t=0,ty='sine',v=.22){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;const n=AC.currentTime+t;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
function beep(k){if(!snd)return;
  if(k==='ok'){tone(660,.12);tone(990,.18,.1)}else if(k==='bad'){tone(170,.3,0,'square',.08)}
  else if(k==='pop'){tone(900,.08,0,'triangle',.25);tone(1400,.06,.05,'triangle',.15)}
  else if(k==='win'){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.35,i*.13))}
  else if(k==='lose'){[440,370,311,262].forEach((f,i)=>tone(f,.3,i*.16,'triangle'))}
  else if(k==='tap'){tone(620,.07,0,'sine',.15)}}
function toggleSnd(){snd=!snd;$('#snd').textContent=snd?'🔊':'🔇'}
let flT;function flash(t){const f=$('#flash');f.textContent=t;f.classList.add('on');clearTimeout(flT);flT=setTimeout(()=>f.classList.remove('on'),900)}

/* confetti */
let CF=0;function stopCF(){CF++;const c=$('#cf');c.width=c.width}
function confetti(){const my=++CF,c=$('#cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;setTimeout(()=>{if(CF===my)stopCF()},4500);
  const cols=['#ffd23f','#ff4d8d','#2ecc71','#3fa9ff','#8e5cff','#ff9f1a'];
  const P=Array.from({length:200},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.6,vx:-2+Math.random()*4,vy:3+Math.random()*5,s:10+Math.random()*12,r:Math.random()*6,vr:-.2+Math.random()*.4,c:one(cols)}));
  (function f(){x.clearRect(0,0,c.width,c.height);if(my!==CF)return;P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});requestAnimationFrame(f)})()}

/* ===== settings: which table ===== */
let SEL=0;try{SEL=+localStorage.getItem('kb_sel')||0}catch(e){}
const T=()=>SEL||rnd(2,9);
function mul(){const a=T(),b=rnd(2,9);return{q:Math.random()<.5?`${a} × ${b}`:`${b} × ${a}`,ans:a*b,a,b}}
function dvd(){const a=T(),b=rnd(2,9);return{q:`${a*b} : ${a}`,ans:b,a,b,dv:true}}
function task(dp=.3){return Math.random()<dp?dvd():mul()}
function traps(t,n=3){const c=t.dv?[t.b+1,t.b-1,t.a,t.b+2,t.b*2]:[t.a*(t.b+1),t.a*(t.b-1),(t.a+1)*t.b,(t.a-1)*t.b,t.a+t.b,t.ans+10];
  const s=new Set([t.ans]);for(const v of shuffle(c)){if(s.size>=n)break;if(v>0&&v!==t.ans)s.add(v)}
  let g=0;while(s.size<n&&g++<60){const v=t.ans+rnd(-6,6);if(v>0)s.add(v)}return shuffle([...s])}
const DIVBY={2:'2-ге',3:'3-ке',4:'4-ке',5:'5-ке',6:'6-ға',7:'7-ге',8:'8-ге',9:'9-ға'};

/* ===== engine ===== */
let RID=0,CUR=null;
const alive=id=>id===RID;
function every(ms,fn,id){const iv=setInterval(()=>{if(!alive(id))return clearInterval(iv);fn()},ms);return iv}
function loop(fn,id){let last=performance.now();(function f(now){if(!alive(id))return;const dt=Math.min(.05,(now-last)/1000);last=now;fn(dt);requestAnimationFrame(f)})(last)}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));scrollTo(0,0)}
function start(g){RID++;stopCF();$('#final').classList.remove('on');CUR=g;$('#gt').textContent=g.icon+' '+g.title;show('game');const st=$('#stage');st.innerHTML='';g.run(st,RID)}
function restart(){start(CUR)}
function goHome(){RID++;stopCF();$('#final').classList.remove('on');show('home')}
function finish(id,win,msg){if(!alive(id))return;RID++;
  $('#fst').textContent=win?'⭐⭐⭐':'🌟';const h=$('#fh');h.textContent=win?'Жарайсың!':'Ойын бітті!';h.className=win?'w':'l';
  $('#fp').innerHTML=msg||'';$('#final').classList.add('on');beep(win?'win':'lose');if(win)confetti()}
function options(box,list,correct,onOk,onBad){box.innerHTML='';delete box.dataset.done;list.forEach(v=>{const b=el('button','opt',typeof v==='number'?fmt(v):v);
  b.onclick=()=>{if(b.disabled||box.dataset.done)return;if(v===correct){box.dataset.done=1;box.querySelectorAll('button').forEach(x=>x.disabled=x!==b);beep('ok');b.classList.add('ok');onOk(b)}else{beep('bad');b.classList.add('no');reanim(b,'shake');b.disabled=true;onBad&&onBad(b)}};box.append(b)})}
function startScreen(st,title,text,btn,go){const s=el('div','startbox',`<div class="title">${title}</div><p>${text}</p>`);const b=el('button','btn g big',btn||'БАСТАУ 🚀');b.onclick=go;s.append(b);st.append(s);return s}

/* ===== GAMES ===== */
const GAMES=[

/* 1. Balloons */
{id:'bal',grp:0,icon:'🎈',title:'Шарларды жар',sub:'Дұрыс жауабы бар шарды жар!',c1:'#ff6b9d',c2:'#b44dff',
run(st,id){
  startScreen(st,'🎈 Шарларды жар','Жоғарыда мысал тұр. Ұшып бара жатқан шарлардың ішінен дұрыс жауабы бар шарды тез жар!<br>12 шар жар — жеңесің. 3 қате — ойын бітеді.',null,()=>{
  st.innerHTML='';const goal=12;let t,score=0,lives=3,bs=[],since=1e9;
  const hud=el('div','hud',`<div class="pill hh"></div><div class="qbox"></div><div class="pill ss"></div>`),sky=el('div','sky');st.append(hud,sky);
  const upd=()=>{hud.querySelector('.qbox').textContent=t.q+' = ?';hud.querySelector('.hh').textContent='❤️'.repeat(lives)+'🤍'.repeat(3-lives);hud.querySelector('.ss').textContent='⭐ '+score+' / '+goal};
  const next=()=>{t=task(.25);upd()};next();
  const COL=['#ff4d8d','#ff9f1a','#2ecc71','#3fa9ff','#8e5cff','#ff4757','#14c9b8'];
  function spawn(){const W=sky.clientWidth,H=sky.clientHeight;const has=bs.some(b=>b.v===t.ans);
    const v=(!has&&Math.random()<.65)?t.ans:one(traps(t,4).filter(x=>x!==t.ans));
    const e=el('button','bal',`<span>${v}</span>`);e.style.setProperty('--c',one(COL));sky.append(e);
    const b={e,v,x:rnd(0,Math.max(0,W-e.offsetWidth)),y:H+10};e.style.transform=`translate(${b.x}px,${b.y}px)`;bs.push(b);
    e.addEventListener('pointerdown',ev=>{ev.preventDefault();if(!alive(id)||b.dead)return;b.dead=true;
      if(b.v===t.ans){beep('pop');e.classList.add('boom');score++;bs=bs.filter(x=>x!==b);setTimeout(()=>e.remove(),260);
        if(score>=goal)return finish(id,true,`Сен ${goal} шар жардың! 🎈`);flash('Дұрыс! 🎉');next()}
      else{beep('bad');e.classList.add('boom');bs=bs.filter(x=>x!==b);setTimeout(()=>e.remove(),260);lives--;upd();flash(`${t.q} = ${t.ans}`);
        if(lives<=0)finish(id,false,`Сен ${score} шар жардың.<br>Тағы байқап көр! 💪`)}})}
  loop(dt=>{const H=sky.clientHeight;const sp=H/Math.max(3.6,7.5-score*.3);since+=dt*1000;
    if(since>Math.max(650,1150-score*35)&&bs.length<7){since=0;spawn()}
    for(const b of bs){b.y-=sp*dt;b.e.style.transform=`translate(${b.x}px,${b.y}px)`}
    bs=bs.filter(b=>{if(b.y<-200){b.e.remove();return false}return true})},id)})}},

/* 2. Rocket */
{id:'rk',grp:0,icon:'🚀',title:'Ракета ғарышқа',sub:'Дұрыс жауап — ракетаға жанармай',c1:'#3f5efb',c2:'#a83ef5',
run(st,id){
  const PL=[['🌍','Жер'],['🌙','Ай'],['🔴','Марс'],['🟠','Юпитер'],['🪐','Сатурн'],['⭐','Жұлдыз']],STEP=3,TOT=(PL.length-1)*STEP;
  startScreen(st,'🚀 Ракета ғарышқа','Әр дұрыс жауап ракетаға жанармай құяды және оны келесі планетаға жақындатады. Жанармай уақыт өте азаяды, қате жауап та жанармайды кетіреді.<br>Жұлдызға жет!',null,()=>{
  st.innerHTML='';let prog=0,fuel=65,t;
  const rk=el('div','rk'),tr=el('div','track'),pn=el('div','panel',`<div class="fuel"><i></i><b>⛽</b></div><div class="pill lv"></div><div class="q"></div><div class="opts"></div>`);
  rk.append(tr,pn);st.append(rk);
  const pos=i=>(4+i/(PL.length-1)*86)+'%';
  const pls=PL.map((p,i)=>{const e=el('div','planet'+(i===0?' got':''),`<b>${p[0]}</b>${p[1]}`);e.style.bottom=pos(i);tr.append(e);return e});
  const rocket=el('div','rocket','<span class="rot">🚀</span><i>🔥</i>');rocket.style.bottom=pos(0);tr.append(rocket);
  const fb=pn.querySelector('.fuel'),fi=fb.querySelector('i'),lv=pn.querySelector('.lv'),q=pn.querySelector('.q'),op=pn.querySelector('.opts');
  const draw=()=>{fi.style.width=Math.max(0,fuel)+'%';fb.classList.toggle('low',fuel<25);const k=Math.floor(prog/STEP);
    lv.textContent=`Келесі: ${PL[Math.min(k+1,PL.length-1)][0]} ${PL[Math.min(k+1,PL.length-1)][1]} · ${prog%STEP}/${STEP}`;
    rocket.style.bottom=(4+prog/TOT*86)+'%'};
  const next=()=>{t=task(.3);q.textContent=t.q+' = ?';options(op,traps(t,3),t.ans,()=>{fuel=Math.min(100,fuel+14);prog++;
      if(prog%STEP===0){const k=prog/STEP;pls[k].classList.add('got');flash(PL[k][0]+' '+PL[k][1]+'! 🎉')}
      draw();if(prog>=TOT)return setTimeout(()=>finish(id,true,'Ракета жұлдызға жетті! ⭐🚀'),600);setTimeout(()=>alive(id)&&next(),350)},
    ()=>{fuel-=12;draw();check()})};
  const check=()=>{if(fuel<=0){const k=Math.floor(prog/STEP);finish(id,false,`Жанармай бітті! ⛽<br>Ракета ${PL[k][0]} ${PL[k][1]} маңында тоқтады.`)}};
  every(1000,()=>{fuel-=2.5;draw();check()},id);draw();next()})}},

/* 3. Falling */
{id:'fall',grp:0,icon:'🧱',title:'Құлап жатқан мысалдар',sub:'Мысал жерге жеткенше шеш!',c1:'#ff9f1a',c2:'#ff4757',
run(st,id){
  startScreen(st,'🧱 Құлап жатқан мысалдар','Мысалдар жоғарыдан құлайды. Жауабын теріп, ✔ бас — мысал жарылады.<br>15 мысал шеш — жеңесің. 5 мысал жерге түссе — ойын бітеді.',null,()=>{
  st.innerHTML='';const goal=15;let score=0,landed=0,items=[],since=1e9,val='';
  const hud=el('div','hud',`<div class="pill ll"></div><div class="pill ss"></div>`),area=el('div','fall','<div class="ground"></div>'),pad=el('div','pad','<div class="disp"></div><div class="keys"></div>');
  st.append(hud,area,pad);const disp=pad.querySelector('.disp'),keys=pad.querySelector('.keys');
  const upd=()=>{hud.querySelector('.ll').textContent='🧱 '+landed+' / 5';hud.querySelector('.ss').textContent='⭐ '+score+' / '+goal;disp.textContent=val||' '};upd();
  const press=k=>{if(!alive(id))return;beep('tap');if(k==='⌫')val=val.slice(0,-1);else if(k==='✔')submit();else if(val.length<3)val+=k;upd()};
  ['1','2','3','4','5','⌫','6','7','8','9','0','✔'].forEach(k=>{const b=el('button','key'+(k==='✔'?' ok':k==='⌫'?' del':''),k);b.onclick=()=>press(k);keys.append(b)});
  const kd=e=>{if(!alive(id))return document.removeEventListener('keydown',kd);if(/^\d$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('⌫');else if(e.key==='Enter')press('✔')};
  document.addEventListener('keydown',kd);
  function submit(){if(!val)return;const v=+val;val='';const hit=items.filter(i=>i.t.ans===v).sort((a,b)=>b.y-a.y)[0];
    if(hit){beep('ok');hit.e.classList.add('boom');items=items.filter(i=>i!==hit);setTimeout(()=>hit.e.remove(),300);score++;
      if(score>=goal)return finish(id,true,`Сен ${goal} мысал шештің! 🧱💥`)}
    else{beep('bad');reanim(disp,'shake')}upd()}
  function spawn(){const t=task(.3),e=el('div','fx',t.q);area.append(e);const x=rnd(0,Math.max(0,area.clientWidth-e.offsetWidth));items.push({t,e,x,y:-60});}
  loop(dt=>{const H=area.clientHeight;since+=dt*1000;if(since>Math.max(1500,3200-score*110)){since=0;spawn()}
    const sp=H/Math.max(5,11-score*.35);
    for(const i of items){i.y+=sp*dt;i.e.style.transform=`translate(${i.x}px,${i.y}px)`}
    items=items.filter(i=>{if(i.y+i.e.offsetHeight>=H-14){i.e.remove();landed++;beep('bad');flash(`${i.t.q} = ${i.t.ans}`);upd();if(landed>=5)finish(id,false,`Сен ${score} мысал шештің.<br>Тағы байқап көр! 💪`);return false}return true})},id)})}},

/* 4. Tug of war */
{id:'tug',grp:1,icon:'🪢',title:'Арқан тартыс',sub:'Екі команда жарысы',c1:'#ff4757',c2:'#3fa9ff',
run(st,id){
  startScreen(st,'🪢 Арқан тартыс','Сынып екі командаға бөлінеді: 🔴 Қызылдар мен 🔵 Көктер. Әр дұрыс жауап арқанды өз жағыңа тартады. Қате жауап — команда 2 секунд күтеді.<br>Арқанды сызыққа дейін тартқан команда жеңеді!',null,()=>{
  st.innerHTML='';let pos=0;const WIN=5;
  const tug=el('div','tug'),rb=el('div','ropebox','<div class="gline L"></div><div class="gline R"></div><div class="cline"></div>'),mv=el('div','mv','<div class="tm">🧒👧🧒</div><div class="rope"><div class="flag">🚩</div></div><div class="tm">🧒👦👧</div>');
  rb.append(mv);const teams=el('div','teams');tug.append(rb,teams);st.append(tug);
  const pull=()=>{mv.style.translate=(pos*7)+'% 0'};
  [['r','🔴 Қызылдар',-1],['b','🔵 Көктер',1]].forEach(([c,name,dir])=>{const p=el('div','team '+c,`<h3>${name}</h3><div class="q"></div><div class="opts"></div>`);teams.append(p);
    const q=p.querySelector('.q'),op=p.querySelector('.opts');
    const next=()=>{const t=task(.3);q.textContent=t.q+' = ?';options(op,traps(t,3),t.ans,()=>{pos+=dir;pull();
        if(Math.abs(pos)>=WIN)return setTimeout(()=>finish(id,true,`${name} жеңді! 🏆`),500);setTimeout(()=>alive(id)&&next(),250)},
      ()=>{p.classList.add('lock');op.querySelectorAll('button').forEach(b=>b.disabled=true);setTimeout(()=>{if(!alive(id))return;p.classList.remove('lock');next()},2000)})};next()})})}},

/* 5. Millionaire */
{id:'mil',grp:1,icon:'💰',title:'Миллионер',sub:'15 сұрақ, 3 көмек',c1:'#2b1a8f',c2:'#ffb400',
run(st,id){
  const PR=[100,200,300,500,1000,2000,4000,8000,16000,32000,64000,125000,250000,500000,1000000],SAFE=[4,9];
  const mk=(q,ans,tr)=>{const s=new Set([ans]);for(const v of shuffle(tr))if(s.size<4&&v>0&&Number.isInteger(v)&&v!==ans)s.add(v);let g=0;while(s.size<4&&g++<80){const v=ans+rnd(-7,7);if(v>0)s.add(v)}return{q,ans,opts:shuffle([...s])}};
  const gen=L=>{if(L<5){const a=SEL||rnd(2,5),b=rnd(2,6);return mk(`${a} × ${b}`,a*b,[a*b+a,a*b-b,a+b,a*b+1])}
    if(L<10){const a=SEL||rnd(3,9),b=rnd(3,9);return Math.random()<.5?mk(`${a} × ${b}`,a*b,[a*(b+1),(a-1)*b,a*b+10,a+b]):mk(`${a*b} : ${a}`,b,[b+1,b-1,a,b+2])}
    const k=rnd(0,3),a=rnd(2,9),b=rnd(2,9),c=rnd(2,9);
    if(k===0)return mk(`${a} × ${b} + ${c}`,a*b+c,[a*(b+c),a*b-c,a*b+c+1]);
    if(k===1){const d=rnd(2,a*b-1);return mk(`${a} × ${b} − ${d}`,a*b-d,[a*b+d,a*b-d+1,a*b-d-1])}
    if(k===2)return mk(`${a} + ${b} × ${c}`,a+b*c,[(a+b)*c,a*b+c,a+b*c+1]);
    return mk(`${a*b} : ${a} × ${c}`,b*c,[b+c,b*c+c,b*c-b])};
  startScreen(st,'💰 Миллионер','15 сұрақ — әр сұрақ сайын ұпай көбейеді. 5-ші және 10-шы сұрақтағы ұпай сақталады.<br>Көмектер: ✂️ 50:50 · 👥 Сыныптан сұрау · 💡 Кеңес — әрқайсысы бір рет.',null,()=>{
  st.innerHTML='';let L=0,cur,busy=false;const used={};
  const mil=el('div','mil'),mm=el('div','mmain',`<div class="life"></div><div class="mq"><small></small><div></div></div><div class="mhint"></div><div class="mopts"></div>`),lad=el('div','ladder');
  mil.append(mm,lad);st.append(mil);
  PR.forEach((p,i)=>lad.append(el('div',SAFE.includes(i)?'safe':'',`<span>${i+1}</span><span>${fmt(p)}</span>`)));
  const life=mm.querySelector('.life'),qs=mm.querySelector('.mq small'),qd=mm.querySelector('.mq div'),hint=mm.querySelector('.mhint'),mo=mm.querySelector('.mopts');
  let btns=[];
  [['50','✂️ 50:50'],['poll','👥 Сыныптан сұрау'],['tip','💡 Кеңес']].forEach(([k,n])=>{const b=el('button','btn y',n);b.onclick=()=>{if(busy||used[k])return;used[k]=1;b.disabled=true;beep('tap');
    const wrong=btns.filter(x=>x.v!==cur.ans&&!x.e.classList.contains('hide'));
    if(k==='50')pick(wrong,2).forEach(x=>x.e.classList.add('hide'));
    if(k==='poll'){const vis=btns.filter(x=>!x.e.classList.contains('hide'));let left=100,c=rnd(45,75);left-=c;const ps={};
      const others=vis.filter(x=>x.v!==cur.ans);others.forEach((x,i)=>{const p=i===others.length-1?left:rnd(0,left);ps[x.v]=p;left-=p});ps[cur.ans]=c;
      vis.forEach(x=>{x.e.querySelector('.poll')?.remove();x.e.append(el('span','poll',ps[x.v]+'%'))})}
    if(k==='tip')hint.textContent=`💡 Жауап — ${cur.ans%2?'тақ':'жұп'} сан, ${cur.ans>=50?'50-ден үлкен немесе тең':'50-ден кіші'}.`};life.append(b)});
  const ladder=()=>[...lad.children].forEach((d,i)=>{d.classList.toggle('cur',i===L);d.classList.toggle('done',i<L)});
  const next=()=>{cur=gen(L);busy=false;hint.textContent='';qs.textContent=`${L+1}-сұрақ · ${fmt(PR[L])} ұпай`;qd.textContent=cur.q+' = ?';ladder();mo.innerHTML='';
    btns=cur.opts.map((v,i)=>{const e=el('button','mo',`<b>${'ABCD'[i]}:</b> ${v}`);mo.append(e);const o={v,e};
      e.onclick=()=>{if(busy||e.classList.contains('hide'))return;busy=true;e.classList.add('sel');beep('tap');
        setTimeout(()=>{if(!alive(id))return;e.classList.remove('sel');
          if(v===cur.ans){e.classList.add('ok');beep('ok');L++;if(L>=15)return setTimeout(()=>finish(id,true,'1 000 000 ұпай!<br>Сен — миллионерсің! 🏆💰'),900);setTimeout(()=>alive(id)&&next(),1100)}
          else{e.classList.add('no');btns.find(x=>x.v===cur.ans).e.classList.add('ok');const s=L>9?PR[9]:L>4?PR[4]:0;
            setTimeout(()=>finish(id,false,`Дұрыс жауап: ${cur.ans}<br>Сенің ұпайың: ${fmt(s)} 💰`),1300)}},1000)};return o})};
  next()})}},

/* 6. Hidden picture */
{id:'hid',grp:2,icon:'🧩',title:'Жасырын сурет',sub:'Мысалды шеш — суретті аш',c1:'#14c9b8',c2:'#3f5efb',
run(st,id){
  const PICS=[['🦁','Арыстан'],['🐘','Піл'],['🦒','Керік'],['🐬','Дельфин'],['🚀','Ракета'],['🐢','Тасбақа'],['🦉','Үкі'],['🐙','Сегізаяқ'],['🦋','Көбелек'],['🏰','Қамал'],['🐧','Пингвин'],['🦓','Зебра'],['🐪','Түйе'],['🦜','Тоты']];
  const P=one(PICS);
  startScreen(st,'🧩 Жасырын сурет','Сурет 16 плитканың астында жасырылған. Плитканы таңдап, мысалды шеш — плитка ашылады.<br>Суретті тапқан кезде «🔍 Суретті таптым!» батырмасын бас. Неғұрлым аз плиткамен тапсаң, соғұрлым жақсы!',null,()=>{
  st.innerHTML='';let opened=0,sel=null;
  const hp=el('div','hp'),bd=el('div','board',`<div class="pic">${P[0]}</div><div class="tiles"></div>`),sd=el('div','side',`<div class="pill">🔓 <span class="oc">0</span> / 16</div><div class="q"></div><div class="opts"></div>`);
  const gb=el('button','btn y big','🔍 Суретті таптым!');sd.append(gb);hp.append(bd,sd);st.append(hp);
  const tl=bd.querySelector('.tiles'),q=sd.querySelector('.q'),op=sd.querySelector('.opts'),oc=sd.querySelector('.oc');
  const tiles=Array.from({length:16},()=>{const t=task(.3),e=el('button','tile',t.q);tl.append(e);const o={t,e,open:false};e.onclick=()=>{if(!o.open)choose(o)};return o});
  function choose(o){if(sel)sel.e.classList.remove('sel');sel=o;o.e.classList.add('sel');beep('tap');q.textContent=o.t.q+' = ?';
    options(op,traps(o.t,3),o.t.ans,()=>{o.open=true;o.e.classList.remove('sel');o.e.classList.add('open');opened++;oc.textContent=opened;sel=null;
      const rest=tiles.filter(x=>!x.open);if(!rest.length){setTimeout(guess,500);return}setTimeout(()=>alive(id)&&choose(one(rest)),350)})}
  function guess(){if(!alive(id))return;const md=el('div','modal'),bx=el('div','mbox','<h3>Суретте не бар?</h3><div class="opts"></div>');md.append(bx);st.append(md);
    const names=shuffle([P,...pick(PICS.filter(x=>x!==P),3)]);const op2=bx.querySelector('.opts');
    names.forEach(n=>{const b=el('button','btn',n[1]);b.onclick=()=>{if(n===P){beep('ok');finish(id,true,`Бұл — ${P[1]} ${P[0]}!<br>Сен ${opened} плитка ашып таптың!`)}else{beep('bad');b.classList.add('no');b.disabled=true}};op2.append(b)});
    if(opened<16){const c=el('button','btn','↩ Ойынға қайту');c.onclick=()=>md.remove();bx.append(c)}}
  gb.onclick=guess;choose(tiles[0])})}},

/* 8. Maze */
{id:'maze',grp:2,icon:'🗺️',title:'Көбейту лабиринті',sub:'Тышқанды ірімшікке жеткіз',c1:'#2ecc71',c2:'#0f9b8e',
run(st,id){
  startScreen(st,'🗺️ Көбейту лабиринті','🐭 Тышқанды 🧀 ірімшікке жеткіз! Тек берілген санға бөлінетін сандардың үстімен жүруге болады (мысалы, 7-ге: 7, 14, 21…).<br>Қате қадам — тышқан басына оралады. 3 лабиринттен өт!',null,()=>{
  let lv=0;const R=5,C=6;const ds=SEL?[SEL,SEL,SEL]:pick([3,4,5,6,7,8,9],3);
  function genPath(){for(let tr=0;tr<400;tr++){const p=[[0,0]],seen=new Set(['0,0']);let r=0,c=0,ok=true;
      while(!(r===R-1&&c===C-1)){const nb=[[r+1,c],[r,c+1],[r-1,c],[r,c-1]].filter(([a,b])=>a>=0&&b>=0&&a<R&&b<C&&!seen.has(a+','+b)&&
          [[a+1,b],[a-1,b],[a,b+1],[a,b-1]].filter(([x,y])=>seen.has(x+','+y)).length===1);
        if(!nb.length){ok=false;break}const w=nb.map(([a,b])=>(a>r||b>c)?3:1);let s=Math.random()*w.reduce((x,y)=>x+y),i=0;while((s-=w[i])>0)i++;
        [r,c]=nb[i];seen.add(r+','+c);p.push([r,c])}
      if(ok&&p.length>=R+C+1)return p}
    const p=[[0,0]];let r=0,c=0;shuffle([...Array(C-1).fill(1),...Array(R-1).fill(0)]).forEach(m=>{m?c++:r++;p.push([r,c])});return p}
  function level(){st.innerHTML='';const d=ds[lv],path=genPath(),onP=new Set(path.map(x=>x+''));
    const val=[];for(let r=0;r<R;r++){val.push([]);for(let c=0;c<C;c++){let v;if(onP.has(r+','+c))v=d*rnd(1,10);else{do{v=rnd(2,d*10+5)}while(v%d===0)}val[r].push(v)}}
    st.append(el('div','title',`Тек <span style="color:#ffd23f">${DIVBY[d]}</span> бөлінетін сандармен жүр!`),el('div','pill',`🗺️ ${lv+1} / 3 лабиринт`));
    const mz=el('div','maze');mz.style.gridTemplateColumns=`repeat(${C},1fr)`;st.append(mz);let me=[0,0];const vis=new Set(['0,0']);
    const cells=[];for(let r=0;r<R;r++)for(let c=0;c<C;c++){const e=el('button','cell',val[r][c]);mz.append(e);cells.push(e);e.onclick=()=>step(r,c,e)}
    const at=(r,c)=>cells[r*C+c];
    const draw=()=>{cells.forEach((e,i)=>{const r=Math.floor(i/C),c=i%C,k=r+','+c;e.className='cell'+(vis.has(k)?' v':'')+(r===me[0]&&c===me[1]?' me':'')+(Math.abs(r-me[0])+Math.abs(c-me[1])===1?' adj':'');
      e.innerHTML=val[r][c]+(r===me[0]&&c===me[1]?'<span class="tk">🐭</span>':r===R-1&&c===C-1?'<span class="tk">🧀</span>':'')})};
    function step(r,c,e){if(!alive(id))return;if(Math.abs(r-me[0])+Math.abs(c-me[1])!==1){flash('Көрші торға ғана жүр 🙂');return}
      if(val[r][c]%d===0){beep('tap');me=[r,c];vis.add(r+','+c);draw();
        if(r===R-1&&c===C-1){beep('ok');lv++;if(lv>=3)return setTimeout(()=>finish(id,true,'Тышқан барлық ірімшікті тапты! 🐭🧀'),500);flash('Келесі лабиринт! 🎉');setTimeout(()=>alive(id)&&level(),1000)}}
      else{beep('bad');e.classList.add('bad');reanim(e,'shake');flash(`${val[r][c]} — ${DIVBY[d]} бөлінбейді!`);setTimeout(()=>{if(!alive(id))return;me=[0,0];draw()},700)}}
    draw()}
  level()})}},

/* 9. Shop */
{id:'shop',grp:2,icon:'🛒',title:'Дүкен',sub:'Сатып ал, санап көр',c1:'#f7b733',c2:'#fc4a1a',
run(st,id){
  const IT=[['🍦','балмұздақ',15],['✏️','қалам',8],['📒','дәптер',12],['🍎','алма',5],['🧃','шырын',9],['🍫','шоколад',14],['🎈','шар',6],['🍌','банан',7],['🧸','ойыншық',25],['🍪','печенье',4],['🥤','сусын',11],['🖍️','бор',3]];
  const N=8;
  const gen=k=>{for(let g=0;g<200;g++){const it=one(IT),n=rnd(2,6),p=it[2],tot=n*p;if(tot>150)continue;
      if(k==='A')return{it,n,q:`${n} ${it[1]} неше теңге тұрады?`,ans:tot,opts:mk(tot,[n+p,(n+1)*p,tot+10,(n-1)*p])};
      if(k==='B'){const W=[50,100,200].find(w=>w>tot);if(!W)continue;const ch=W-tot;return{it,n,W,q:`Сенде ${W} ₸ бар. ${n} ${it[1]} сатып алдың.<br>Қанша қайырым аласың?`,ans:ch,opts:mk(ch,[tot,W-p,ch+10,ch-p])}}
      if(k==='C'){const W=Math.random()<.5?tot+rnd(0,p-1):tot-rnd(1,p);if(W<5)continue;const yes=W>=tot;
        return{it,n,W,q:`Сенде ${W} ₸ бар.<br>${n} ${it[1]} сатып алуға ақшаң жете ме?`,ans:yes?'Иә, жетеді ✅':'Жоқ, жетпейді ❌',opts:['Иә, жетеді ✅','Жоқ, жетпейді ❌'],txt:true}}}};
  const mk=(a,tr)=>{const s=new Set([a]);for(const v of shuffle(tr))if(s.size<3&&v>=0&&v!==a)s.add(v);let g=0;while(s.size<3&&g++<50)s.add(a+rnd(1,9));return shuffle([...s])};
  startScreen(st,'🛒 Дүкен','Дүкенге келдік! Тауардың бағасына қарап, барлығы неше теңге болатынын, қанша қайырым аласың немесе ақшаң жете ме — соны есепте.',null,()=>{
  const tasks=shuffle(['A','A','A','B','B','B','C','C']).map(gen);let i=0;
  const draw=()=>{st.innerHTML='';const t=tasks[i];const dots=el('div','dots');tasks.forEach((_,j)=>dots.append(el('i',j<i?'d':j===i?'c':'')));
    const sh=el('div','shop');st.append(dots,sh);
    sh.append(el('div','shelf',`<div class="tag"><em>${t.it[0]}</em>${t.it[1]} <span class="pr">${t.it[2]} ₸</span></div>`+(t.W?`<div class="wallet">👛 ${t.W} ₸</div>`:'')));
    sh.append(el('div','basket',Array(t.n).fill(t.it[0]).join('')),el('div','sq',t.q));
    const op=el('div','opts');sh.append(op);
    options(op,t.opts,t.ans,()=>{i++;if(i>=N)return setTimeout(()=>finish(id,true,'Сен нағыз сатып алушысың! 🛒💰'),700);setTimeout(()=>alive(id)&&draw(),800)},
      ()=>{if(t.txt)setTimeout(()=>{if(!alive(id))return;flash(`${t.n} × ${t.it[2]} = ${t.n*t.it[2]} ₸`)},200)});
    if(!t.txt)op.querySelectorAll('.opt').forEach(b=>b.textContent+=' ₸');else op.querySelectorAll('.opt').forEach(b=>b.classList.add('txt'))};
  draw()})}},
];

/* ===== home ===== */
const chips=$('#chips');
[0,2,3,4,5,6,7,8,9].forEach(n=>{const c=el('button','chip'+(n===SEL?' on':''),n?'× '+n:'🎲 Аралас');c.onclick=()=>{SEL=n;try{localStorage.setItem('kb_sel',n)}catch(e){}chips.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');beep('tap')};chips.append(c)});
['⚡ Жылдамдық ойындары','👥 Бүкіл сыныппен','🧠 Ойлан, тап'].forEach((g,gi)=>{const s=el('div','sec',`<h2>${g}</h2>`),cs=el('div','cards');s.append(cs);$('#groups').append(s);
  GAMES.filter(x=>x.grp===gi).forEach(x=>{const c=el('button','card',`<div class="ic">${x.icon}</div><div><div class="t">${x.title}</div><div class="s">${x.sub}</div></div>`);c.style.setProperty('--c1',x.c1);c.style.setProperty('--c2',x.c2);c.onclick=()=>{beep('tap');start(x)};cs.append(c)})});
</script>
